<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Rádio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Inter,sans-serif;
height:100vh;
overflow:hidden;
color:white;
background:#000;
}

#bg{
position:fixed;
inset:0;
background:url('https://i.ibb.co/8YRKcJm/radio.png') center/cover;
filter:blur(40px) brightness(.25);
transform:scale(1.2);
}

.overlay{
position:fixed;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.8));
}

.topbar{
position:absolute;
top:20px;
left:30px;
right:30px;
display:flex;
justify-content:space-between;
z-index:5;
}

.logo{
font-size:1.2rem;
font-weight:700;
letter-spacing:2px;
}

.main{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.cover{
width:340px;
height:340px;
border-radius:30px;
object-fit:cover;
box-shadow:0 0 60px rgba(37,99,235,.4);
animation:float 6s ease-in-out infinite;
}

@keyframes float{
50%{transform:translateY(-10px)}
}

.song{
font-size:2rem;
font-weight:700;
margin-top:30px;
}

.artist{
font-size:1.1rem;
opacity:.8;
margin-top:8px;
}

.controls{
margin-top:25px;
display:flex;
gap:15px;
align-items:center;
}

.btn{
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#2563eb;
color:white;
cursor:pointer;
font-size:1.4rem;
}

.volume{
width:250px;
}

.bottom{
position:absolute;
bottom:20px;
left:20px;
right:20px;
z-index:5;
}

.history-title{
margin-bottom:12px;
font-weight:600;
}

.history{
display:flex;
gap:12px;
overflow-x:auto;
}

.card{
min-width:160px;
backdrop-filter:blur(10px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:10px;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:12px;
margin-bottom:8px;
}

.card-title{
font-size:.85rem;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

@media(max-width:768px){
.cover{width:250px;height:250px}
.song{font-size:1.4rem}
.volume{width:180px}
}
</style>
</head>

<body>

<div id="bg"></div>
<div class="overlay"></div>

<div class="topbar">
<div class="logo">NEXUS RÁDIO</div>
</div>

<div class="main">
<img id="cover" class="cover" src="https://i.ibb.co/8YRKcJm/radio.png">

<div id="song" class="song">A carregar...</div>
<div id="artist" class="artist">NexusPT</div>

<div class="controls">
<button id="play" class="btn"><i class="fa-solid fa-play"></i></button>
<input id="volume" class="volume" type="range" min="0" max="100" value="80">
</div>
</div>

<div class="bottom">
<div class="history-title">Últimas músicas</div>
<div id="history" class="history"></div>
</div>

<audio id="player" src="https://stream.zeno.fm/fmgajinfd6ctv"></audio>

<script>
const audio=document.getElementById('player');
const play=document.getElementById('play');
const volume=document.getElementById('volume');
const songEl=document.getElementById('song');
const artistEl=document.getElementById('artist');
const cover=document.getElementById('cover');
const bg=document.getElementById('bg');
const historyDiv=document.getElementById('history');

let maxHistory=8;

/* PLAY */
play.onclick=async()=>{
if(audio.paused){
await audio.play();
play.innerHTML='<i class="fa-solid fa-pause"></i>';
}else{
audio.pause();
play.innerHTML='<i class="fa-solid fa-play"></i>';
}
};

volume.oninput=e=>audio.volume=e.target.value/100;
audio.volume=.8;

/* COVER */
async function getCover(query){
try{
const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(query)+'&limit=1');
const d=await r.json();
if(d.results && d.results[0]){
return d.results[0].artworkUrl100.replace('100x100','600x600');
}
}catch(e){}
return 'https://i.ibb.co/8YRKcJm/radio.png';
}

/* UPDATE TRACK */
async function updateTrack(title){
const parts=title.split(' - ');
const artist=parts[0]||'Artista';
const song=parts[1]||title;

artistEl.textContent=artist;
songEl.textContent=song;

const image=await getCover(title);

cover.src=image;
bg.style.backgroundImage=`url('${image}')`;

const card=document.createElement('div');
card.className='card';
card.innerHTML=`<img src="${image}"><div class="card-title">${song}</div>`;

historyDiv.prepend(card);

while(historyDiv.children.length>maxHistory){
historyDiv.lastChild.remove();
}

if('mediaSession' in navigator){
navigator.mediaSession.metadata=new MediaMetadata({
title:song,
artist:artist,
artwork:[{src:image,sizes:'600x600',type:'image/jpeg'}]
});
}
}

/* STREAM */
const source=new EventSource('https://api.zeno.fm/mounts/metadata/subscribe/g4yosibn9yivv');

source.onmessage=(e)=>{
try{
const data=JSON.parse(e.data);
if(data.streamTitle){
updateTrack(data.streamTitle);
}
}catch(err){}
};
</script>

</body>
</html>
