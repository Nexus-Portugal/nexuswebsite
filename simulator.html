<!doctype html>
<html lang="pt-pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador de Preço | NexusPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #000000;
  --bg-secondary: #0a0a0a;
  --bg-tertiary: #111111;
  --text: #f5f5f7;
  --text-secondary: #86868b;
  --text-tertiary: #6e6e73;
  --accent: #00f43c;
  --accent-gradient: linear-gradient(135deg, #00f43c, #00c9ff);
  --border: rgba(255,255,255,0.08);
  --nav-blur: blur(60px) saturate(180%);
  --nav-bg: rgba(0,0,0,0.8);
  --ease: cubic-bezier(0.42, 0, 0.58, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --container: 1200px;
  --radius: 16px;
  --radius-lg: 24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
::selection{background: rgba(0,244,60,0.3)}
.wrap{max-width: var(--container); margin: 0 auto; padding: 0 28px}

.header{
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  padding: 0;
  height: 52px;
  display: flex;
  align-items: center;
  transition: background 0.4s var(--ease), backdrop-filter 0.4s var(--ease), border-color 0.4s var(--ease);
  background: transparent;
  border-bottom: 1px solid transparent;
}
.header.scrolled{
  background: var(--nav-bg);
  backdrop-filter: var(--nav-blur);
  -webkit-backdrop-filter: var(--nav-blur);
  border-bottom-color: var(--border);
}
.header .wrap{display: flex; justify-content: space-between; align-items: center; width: 100%}
.logo{display: flex; align-items: center; text-decoration: none; color: var(--text); font-weight: 600; font-size: 18px; letter-spacing: -0.02em}
.logo img{height: 26px; display: block}
.nav{display: flex; align-items: center; gap: 2px}
.nav a{
  color: var(--text-secondary); text-decoration: none; font-weight: 400;
  font-size: 13px; padding: 6px 14px; border-radius: 6px;
  transition: color 0.3s var(--ease), background 0.3s var(--ease);
  letter-spacing: 0.01em;
}
.nav a:hover{color: var(--text); background: rgba(255,255,255,0.06)}
.nav a.active{color: var(--text)}

.menu-toggle{
  display: none; flex-direction: column; justify-content: center; align-items: center;
  width: 36px; height: 36px; background: transparent; border: none; cursor: pointer; padding: 0;
}
.menu-toggle span, .menu-toggle span::before, .menu-toggle span::after{
  display: block; width: 18px; height: 1.5px; background: var(--text);
  border-radius: 1px; position: relative; transition: all 0.3s var(--ease);
}
.menu-toggle span::before{content: ''; position: absolute; left: 0; top: -5px}
.menu-toggle span::after{content: ''; position: absolute; left: 0; top: 5px}
.menu-toggle.active span{background: transparent}
.menu-toggle.active span::before{transform: rotate(45deg); top: 0}
.menu-toggle.active span::after{transform: rotate(-45deg); top: 0}

.mobile-nav{
  display: none; position: fixed; top: 52px; right: -100%; width: 100%;
  max-width: 360px; height: calc(100vh - 52px);
  background: rgba(0,0,0,0.97); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  padding: 32px 28px; transition: right 0.5s var(--ease-out); z-index: 999;
  border-left: 1px solid var(--border);
}
.mobile-nav.active{right: 0}
.mobile-nav a{
  display: block; color: var(--text-secondary); text-decoration: none;
  font-weight: 400; font-size: 17px; padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04); transition: color 0.3s var(--ease);
}
.mobile-nav a:hover, .mobile-nav a.active{color: var(--text)}
.mobile-overlay{
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  opacity: 0; transition: opacity 0.4s var(--ease); z-index: 998; pointer-events: none;
}
.mobile-overlay.active{display: block; opacity: 1; pointer-events: auto}

.client-area{display: flex; align-items: center; justify-content: center; margin-left: 12px; opacity: 0.6; transition: opacity 0.3s var(--ease)}
.client-area:hover{opacity: 1}
.client-area img{width: 20px; height: 20px; display: block}
@media(max-width:768px){.client-area{display:none}}

.scroll-progress{position: fixed; top: 0; left: 0; height: 1px; background: var(--accent-gradient); z-index: 1001; transition: width 0.1s linear}

.simulator-section{padding: 140px 0 120px 0}
.simulator-container{max-width: 700px; margin: 0 auto}
.simulator-header{margin-bottom: 48px; text-align: center}
.simulator-header h1{font-size: clamp(28px, 3.5vw, 40px); font-weight: 600; letter-spacing: -0.03em; margin-bottom: 12px}
.simulator-header p{color: var(--text-secondary); font-size: 16px}

.price-field{margin-bottom: 36px}
.price-field label{display: block; color: var(--text); font-weight: 500; font-size: 14px; margin-bottom: 14px; letter-spacing: -0.01em}
.price-options{display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px}
.price-option{
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px; background: var(--bg-tertiary); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer; transition: all 0.3s var(--ease-out);
  text-align: center; min-height: 90px;
}
.price-option:hover{border-color: rgba(0,244,60,0.3); transform: translateY(-2px)}
.price-option.active{border-color: rgba(0,244,60,0.5); background: rgba(0,244,60,0.06)}
.price-option-title{color: var(--text); font-weight: 500; font-size: 13px; margin-bottom: 6px}
.price-option-value{color: var(--accent); font-weight: 600; font-size: 15px}

.price-summary{
  background: var(--bg-tertiary); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px; margin: 40px 0 28px;
}
.price-item{
  display: flex; justify-content: space-between; align-items: center;
  color: var(--text-secondary); font-size: 14px; margin-bottom: 14px;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.price-item:last-child{
  margin-bottom: 0; padding-bottom: 0; border-bottom: none;
  font-weight: 600; color: var(--text); font-size: 17px;
  padding-top: 14px; border-top: 1px solid rgba(0,244,60,0.2);
}
.price-item strong{color: var(--accent); font-weight: 600}

.simulator-actions{display: flex; gap: 12px}
.btn{
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 28px; background: var(--accent-gradient); color: #000;
  font-weight: 600; font-size: 14px; text-decoration: none;
  border-radius: 100px; border: none; cursor: pointer;
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
  flex: 1; justify-content: center;
}
.btn:hover{transform: scale(1.02); box-shadow: 0 0 30px rgba(0,244,60,0.2)}
.btn.secondary{
  background: transparent; border: 1px solid rgba(255,255,255,0.2);
  color: var(--text); flex: 1;
}
.btn.secondary:hover{background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.4)}

.footer{background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 48px 0 24px; text-align: center}
.footer-links{display: flex; justify-content: center; gap: 28px; margin-bottom: 28px; flex-wrap: wrap}
.footer-links a{color: var(--text-secondary); text-decoration: none; font-size: 12px; transition: color 0.3s var(--ease); letter-spacing: 0.02em}
.footer-links a:hover{color: var(--text)}
.footer p{color: var(--text-tertiary); font-size: 12px}

@media(max-width: 768px){
  .menu-toggle{display: flex}
  .mobile-nav{display: block}
  .mobile-overlay.active{display: block}
  .nav{display: none}
  .simulator-section{padding: 100px 0 80px 0}
  .price-options{grid-template-columns: repeat(2, 1fr)}
  .price-summary{padding: 24px}
  .simulator-actions{flex-direction: column}
  .footer{padding: 36px 0 20px}
  .footer-links{gap: 20px}
}
@media(max-width: 480px){.price-options{grid-template-columns: 1fr}}
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<section class="simulator-section">
  <div class="wrap">
    <div class="simulator-container">
      <div class="simulator-header">
        <h1>Simulador de Preço</h1>
        <p>Personaliza o teu plano de alojamento</p>
      </div>

      <div class="price-field">
        <label id="ramLabel">Memória RAM</label>
        <div class="price-options" id="ramOptions"></div>
      </div>
      <div class="price-field">
        <label id="storageLabel">Memória Permanente</label>
        <div class="price-options" id="storageOptions"></div>
      </div>
      <div class="price-field">
        <label id="diskLabel">Espaço em Disco</label>
        <div class="price-options" id="diskOptions"></div>
      </div>
      <div class="price-field">
        <label id="priorityLabel">Prioridade</label>
        <div class="price-options" id="priorityOptions"></div>
      </div>

      <div class="price-summary">
        <div class="price-item"><span>Preço Base</span><strong id="basePrice">1.00€</strong></div>
        <div class="price-item"><span>RAM</span><strong id="ramPrice">0€</strong></div>
        <div class="price-item"><span>Memória Permanente</span><strong id="storagePrice">0.15€</strong></div>
        <div class="price-item"><span>Disco</span><strong id="diskPrice">0€</strong></div>
        <div class="price-item"><span>Prioridade</span><strong id="priorityPrice">0€</strong></div>
        <div class="price-item"><span>Total Mensal</span><strong id="totalPrice">1.15€</strong></div>
      </div>

      <div class="simulator-actions">
        <button class="btn secondary" onclick="window.history.back()">Voltar</button>
        <button class="btn" onclick="contratarAgora()">Contratar Agora →</button>
      </div>
    </div>
  </div>
</section>

<script src="https://kikalabs-server.nexuspt.eu/js/site-nxweb/fh.js"></script>

<script>
const progressBar = document.getElementById('scrollProgress');
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  progressBar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100 + '%';
});

let pricingData = null;
let selectedPrices = {};

const fallbackPricing = {
  basePrice: 1.00,
  currency: "€",
  categories: {
    ram: { label: "Memória RAM", options: [
      { id: "ram-215", title: "215 Mb", price: 0, priceDisplay: "0€", default: true },
      { id: "ram-500", title: "500 Mb", price: 0.25, priceDisplay: "+0.25€" },
      { id: "ram-1gb", title: "1 Gb", price: 0.50, priceDisplay: "+0.50€" },
      { id: "ram-2gb", title: "2 Gb", price: 1.00, priceDisplay: "+1€" }
    ]},
    storage: { label: "Memória Permanente", options: [
      { id: "storage-no", title: "Não", price: 0, priceDisplay: "0€" },
      { id: "storage-yes", title: "Incluída", price: 0.15, priceDisplay: "+0.15€", default: true }
    ]},
    disk: { label: "Espaço em Disco", options: [
      { id: "disk-2gb", title: "2 Gb", price: 0, priceDisplay: "0€", default: true },
      { id: "disk-5gb", title: "5 Gb", price: 0.50, priceDisplay: "+0.50€" },
      { id: "disk-10gb", title: "10 Gb", price: 1.00, priceDisplay: "+1€" },
      { id: "disk-50gb", title: "50 Gb", price: 5.00, priceDisplay: "+5€" }
    ]},
    priority: { label: "Prioridade", options: [
      { id: "priority-no", title: "Não", price: 0, priceDisplay: "0€", default: true },
      { id: "priority-yes", title: "Incluída", price: 2.00, priceDisplay: "+2€" }
    ]}
  }
};

async function loadPricing() {
  try {
    const response = await fetch('https://kikalabs-server.nexuspt.eu/json/site-nxweb/precoscustom.json');
    if (!response.ok) throw new Error('Ficheiro não encontrado');
    pricingData = await response.json();
  } catch (e) {
    console.warn('A usar preços de fallback - podem não estar atualizados');
    pricingData = fallbackPricing;
  }
  initializeSimulator();
}

function initializeSimulator() {
  const { categories, basePrice } = pricingData;
  Object.keys(categories).forEach(key => {
    const category = categories[key];
    const container = document.getElementById(key + 'Options');
    const label = document.getElementById(key + 'Label');
    if (label) label.textContent = category.label;
    category.options.forEach((option) => {
      const div = document.createElement('div');
      div.className = 'price-option' + (option.default ? ' active' : '');
      div.dataset.value = option.price;
      div.innerHTML = `<div class="price-option-title">${option.title}</div><div class="price-option-value">${option.priceDisplay}</div>`;
      container.appendChild(div);
      if (option.default) selectedPrices[key] = option.price;
    });
  });
  setupAllListeners();
  calculatePrice();
}

function setupAllListeners() {
  ['ram', 'storage', 'disk', 'priority'].forEach(key => {
    const options = document.getElementById(key + 'Options').querySelectorAll('.price-option');
    options.forEach(option => {
      option.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('active'));
        option.classList.add('active');
        selectedPrices[key] = parseFloat(option.dataset.value);
        calculatePrice();
      });
    });
  });
}

function calculatePrice() {
  if (!pricingData) return;
  const base = pricingData.basePrice;
  const total = base + selectedPrices.ram + selectedPrices.storage + selectedPrices.disk + selectedPrices.priority;
  const c = pricingData.currency || '€';
  document.getElementById('basePrice').textContent = `${base.toFixed(2)}${c}`;
  document.getElementById('ramPrice').textContent = selectedPrices.ram > 0 ? `+${selectedPrices.ram.toFixed(2)}${c}` : `0${c}`;
  document.getElementById('storagePrice').textContent = `${selectedPrices.storage.toFixed(2)}${c}`;
  document.getElementById('diskPrice').textContent = selectedPrices.disk > 0 ? `+${selectedPrices.disk.toFixed(2)}${c}` : `0${c}`;
  document.getElementById('priorityPrice').textContent = selectedPrices.priority > 0 ? `+${selectedPrices.priority.toFixed(2)}${c}` : `0${c}`;
  document.getElementById('totalPrice').textContent = `${total.toFixed(2)}${c}`;
}

function contratarAgora() {
  window.location.href = `contact.html?plan=${document.getElementById('totalPrice').textContent}`;
}

loadPricing();
</script>

</body>
</html>
