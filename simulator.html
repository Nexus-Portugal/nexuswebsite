<!doctype html>
<html lang="pt-pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador de Preço | NexusPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-primary: #0a0a0a;
  --bg-secondary: #141414;
  --bg-tertiary: #1a1a1a;
  --text-primary: #ffffff;
  --text-secondary: #b0b0b0;
  --accent-gradient: linear-gradient(135deg, #00f43c 0%, #00c9ff 100%);
  --accent-glow: 0 0 40px rgba(0, 244, 60, 0.3);
  --border-subtle: rgba(255,255,255,0.08);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --container: 1280px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
}

.wrap{max-width: var(--container); margin: auto; padding: 0 24px}

/* ===== HEADER ===== */
.header{
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  padding: 20px 0;
  transition: all 0.4s var(--ease-smooth);
}
.header.scrolled{
  padding: 12px 0;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}
.header .wrap{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo img{height: 42px}

.nav{display: flex; gap: 8px}
.nav a{
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
  padding: 10px 16px;
  border-radius: 8px;
  transition: all 0.3s var(--ease-smooth);
}
.nav a:hover,
.nav a.active{
  color: var(--text-primary);
  background: rgba(255,255,255,0.08);
}

/* Mobile Menu Toggle */
.menu-toggle{
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s var(--ease-smooth);
  z-index: 1001;
}
.menu-toggle:hover{
  background: rgba(255,255,255,0.15);
}
.menu-toggle span{
  display: block;
  width: 20px;
  height: 2px;
  background: var(--text-primary);
  transition: all 0.3s var(--ease-smooth);
  position: relative;
}
.menu-toggle span::before,
.menu-toggle span::after{
  content: '';
  position: absolute;
  width: 20px;
  height: 2px;
  background: var(--text-primary);
  left: 0;
  transition: all 0.3s var(--ease-smooth);
}
.menu-toggle span::before{top: -6px}
.menu-toggle span::after{top: 6px}

.menu-toggle.active span{
  background: transparent;
}
.menu-toggle.active span::before{
  transform: rotate(45deg);
  top: 0;
}
.menu-toggle.active span::after{
  transform: rotate(-45deg);
  top: 0;
}

/* Mobile Navigation */
.mobile-nav{
  display: none;
  position: fixed;
  top: 0;
  right: -100%;
  width: 80%;
  max-width: 320px;
  height: 100vh;
  background: var(--bg-secondary);
  padding: 100px 32px 32px;
  transition: right 0.4s var(--ease-out);
  z-index: 999;
  border-left: 1px solid var(--border-subtle);
}
.mobile-nav.active{
  right: 0;
}
.mobile-nav a{
  display: block;
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
  font-size: 18px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  transition: all 0.3s var(--ease-smooth);
}
.mobile-nav a:hover,
.mobile-nav a.active{
  color: var(--text-primary);
  padding-left: 8px;
}
.mobile-overlay{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.3s var(--ease-smooth);
  z-index: 998;
}
.mobile-overlay.active{
  opacity: 1;
}

/* ===== SIMULATOR SECTION ===== */
.simulator-section{
  padding: 180px 0 120px 0;
}

.simulator-container{
  max-width: 700px;
  margin: 0 auto;
}

.price-field{
  margin-bottom: 40px;
}
.price-field label{
  display: block;
  color: var(--text-primary);
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}
.price-options{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.price-option{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s var(--ease-smooth);
  text-align: center;
  min-height: 100px;
}
.price-option:hover{
  border-color: rgba(0,244,60,0.3);
  transform: translateY(-2px);
}
.price-option.active{
  border-color: rgba(0,244,60,0.5);
  background: rgba(0,244,60,0.08);
}
.price-option-title{
  color: var(--text-primary);
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 6px;
}
.price-option-value{
  color: #00f43c;
  font-weight: 700;
  font-size: 16px;
}

.price-summary{
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 32px;
  margin-top: 40px;
}
.price-item{
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-secondary);
  font-size: 15px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.price-item:last-child{
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 18px;
  padding-top: 16px;
  border-top: 2px solid rgba(0,244,60,0.2);
}
.price-item strong{
  color: #00f43c;
  font-weight: 600;
}

.simulator-actions{
  display: flex;
  gap: 16px;
}
.btn{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 32px;
  background: var(--accent-gradient);
  color: #0a0a0a;
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  transition: all 0.3s var(--ease-out);
  flex: 1;
  justify-content: center;
}
.btn:hover{
  transform: translateY(-2px);
}
.btn.secondary{
  background: transparent;
  border: 2px solid rgba(255,255,255,0.3);
  color: var(--text-primary);
  flex: 1;
}
.btn.secondary:hover{
  border-color: var(--text-primary);
  background: rgba(255,255,255,0.08);
}

/* ===== FOOTER ===== */
.footer{
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-subtle);
  padding: 60px 0 30px;
  text-align: center;
}
.footer-links{
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}
.footer-links a{
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  transition: color 0.3s var(--ease-smooth);
}
.footer-links a:hover{color: var(--text-primary)}
.footer p{color: var(--text-secondary); font-size: 14px}

/* ===== SCROLL PROGRESS ===== */
.scroll-progress{
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  background: var(--accent-gradient);
  z-index: 1001;
  transition: width 0.1s linear;
}

/* ===== RESPONSIVE ===== */
@media(max-width: 768px){
  .menu-toggle{
    display: flex;
  }
  .mobile-nav{
    display: block;
  }
  .mobile-overlay{
    display: block;
  }
  .nav{
    display: none;
  }
  
  .simulator-section{
    padding: 100px 0 80px 0;
  }
  
  .simulator-container{
    padding: 0 16px;
  }
  
  .price-options{
    grid-template-columns: repeat(2, 1fr);
  }
  
  .price-summary{
    padding: 24px;
  }
  
  .simulator-actions{
    flex-direction: column;
  }
  
  .btn{
    flex: 1;
  }
}

@media(max-width: 480px){
  .price-options{
    grid-template-columns: 1fr;
  }
}
        /* Ícone da Área do Cliente */
        .client-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 1rem;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .client-area img {
            width: 32px;
            height: 32px;
            display: block;
        }

        .client-area:hover {
            transform: scale(1.1);
            opacity: 0.85;
        }

        /* Em mobile, esconder o ícone no header porque já existe no menu */
        @media (max-width: 768px) {
          .client-area {
            display: none;
          }
        }
</style>
</head>

<body>

<section class="simulator-section">
  <div class="wrap">
    <div class="simulator-container">
      <div class="price-field">
        <label id="ramLabel">Memória RAM</label>
        <div class="price-options" id="ramOptions"></div>
      </div>

      <div class="price-field">
        <label id="storageLabel">Memória Permanente</label>
        <div class="price-options" id="storageOptions"></div>
      </div>

      <div class="price-field">
        <label id="diskLabel">Espaço em Disco</label>
        <div class="price-options" id="diskOptions"></div>
      </div>

      <div class="price-field">
        <label id="priorityLabel">Prioridade</label>
        <div class="price-options" id="priorityOptions"></div>
      </div>

      <div class="price-summary">
        <div class="price-item">
          <span>Preço Base</span>
          <strong id="basePrice">1.00€</strong>
        </div>
        <div class="price-item">
          <span>RAM</span>
          <strong id="ramPrice">0€</strong>
        </div>
        <div class="price-item">
          <span>Memória Permanente</span>
          <strong id="storagePrice">0.15€</strong>
        </div>
        <div class="price-item">
          <span>Disco</span>
          <strong id="diskPrice">0€</strong>
        </div>
        <div class="price-item">
          <span>Prioridade</span>
          <strong id="priorityPrice">0€</strong>
        </div>
        <div class="price-item">
          <span>Total Mensal</span>
          <strong id="totalPrice">1.15€</strong>
        </div>
      </div>

      <div class="simulator-actions">
        <button class="btn secondary" onclick="window.history.back()">Voltar</button>
        <button class="btn" onclick="contratarAgora()">Contratar Agora →</button>
      </div>
    </div>
  </div>
</section>

<script src="https://kikalabs-server.nexuspt.eu/js/site-nxweb/fh.js"></script>
<script>
/* ===== PRICE CALCULATOR ===== */
let pricingData = null;
let selectedPrices = {};

const fallbackPricing = {
  basePrice: 1.00,
  currency: "€",
  categories: {
    ram: {
      label: "Memória RAM",
      options: [
        { id: "ram-215", title: "215 Mb", price: 0, priceDisplay: "0€", default: true },
        { id: "ram-500", title: "500 Mb", price: 0.25, priceDisplay: "+0.25€" },
        { id: "ram-1gb", title: "1 Gb", price: 0.50, priceDisplay: "+0.50€" },
        { id: "ram-2gb", title: "2 Gb", price: 1.00, priceDisplay: "+1€" }
      ]
    },
    storage: {
      label: "Memória Permanente",
      options: [
        { id: "storage-no", title: "Não", price: 0, priceDisplay: "0€" },
        { id: "storage-yes", title: "Incluída", price: 0.15, priceDisplay: "+0.15€", default: true }
      ]
    },
    disk: {
      label: "Espaço em Disco",
      options: [
        { id: "disk-2gb", title: "2 Gb", price: 0, priceDisplay: "0€", default: true },
        { id: "disk-5gb", title: "5 Gb", price: 0.50, priceDisplay: "+0.50€" },
        { id: "disk-10gb", title: "10 Gb", price: 1.00, priceDisplay: "+1€" },
        { id: "disk-50gb", title: "50 Gb", price: 5.00, priceDisplay: "+5€" }
      ]
    },
    priority: {
      label: "Prioridade",
      options: [
        { id: "priority-no", title: "Não", price: 0, priceDisplay: "0€", default: true },
        { id: "priority-yes", title: "Incluída", price: 2.00, priceDisplay: "+2€" }
      ]
    }
  }
};

async function loadPricing() {
  try {
    const response = await fetch('https://kikalabs-server.nexuspt.eu/json/site-nxweb/precoscustom.json');
    if (!response.ok) throw new Error('Ficheiro não encontrado');
    pricingData = await response.json();
  } catch (error) {
    console.warn('A usar preços de fallback - podem não estar atualizados');
    pricingData = fallbackPricing;
  }
  initializeSimulator();
}

function initializeSimulator() {
  const { categories, basePrice } = pricingData;
  
  Object.keys(categories).forEach(key => {
    const category = categories[key];
    const container = document.getElementById(key + 'Options');
    const label = document.getElementById(key + 'Label');
    
    if (label) label.textContent = category.label;
    
    category.options.forEach((option, index) => {
      const div = document.createElement('div');
      div.className = 'price-option' + (option.default ? ' active' : '');
      div.dataset.value = option.price;
      div.innerHTML = `
        <div class="price-option-title">${option.title}</div>
        <div class="price-option-value">${option.priceDisplay}</div>
      `;
      container.appendChild(div);
      
      if (option.default) {
        selectedPrices[key] = option.price;
      }
    });
  });
  
  setupAllListeners();
  calculatePrice();
}

function setupAllListeners() {
  const categories = ['ram', 'storage', 'disk', 'priority'];
  categories.forEach(key => {
    const options = document.getElementById(key + 'Options').querySelectorAll('.price-option');
    setupOptionListeners(options, key);
  });
}

function setupOptionListeners(options, priceKey) {
  options.forEach(option => {
    option.addEventListener('click', () => {
      options.forEach(o => o.classList.remove('active'));
      option.classList.add('active');
      selectedPrices[priceKey] = parseFloat(option.dataset.value);
      calculatePrice();
    });
  });
}

function calculatePrice() {
  if (!pricingData) return;
  
  const basePrice = pricingData.basePrice;
  const total = basePrice + selectedPrices.ram + selectedPrices.storage + selectedPrices.disk + selectedPrices.priority;
  const currency = pricingData.currency || '€';
  
  document.getElementById('basePrice').textContent = `${basePrice.toFixed(2)}${currency}`;
  document.getElementById('ramPrice').textContent = selectedPrices.ram > 0 ? `+${selectedPrices.ram.toFixed(2)}${currency}` : `0${currency}`;
  document.getElementById('storagePrice').textContent = `${selectedPrices.storage.toFixed(2)}${currency}`;
  document.getElementById('diskPrice').textContent = selectedPrices.disk > 0 ? `+${selectedPrices.disk.toFixed(2)}${currency}` : `0${currency}`;
  document.getElementById('priorityPrice').textContent = selectedPrices.priority > 0 ? `+${selectedPrices.priority.toFixed(2)}${currency}` : `0${currency}`;
  document.getElementById('totalPrice').textContent = `${total.toFixed(2)}${currency}`;
}

function contratarAgora() {
  const total = document.getElementById('totalPrice').textContent;
  window.location.href = `contact.html?plan=${total}`;
}

loadPricing();
</script>

</body>
</html>
