<style>
/* ─── SPEED TEST (específico) ─── */
.speedtest-section{padding: 24px 0 100px 0}

.st-app{
  max-width: 820px;
  margin: 0 auto;
  background: #0d0d0d;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 40px 32px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.st-app::before{
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at top, rgba(0,244,60,0.05) 0%, transparent 55%);
  pointer-events: none;
}

/* Estado inicial: apenas o círculo + localização do servidor */
.st-app.is-idle .st-status,
.st-app.is-idle .st-speed{display:none}

.st-server{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 28px;
}
.st-server svg{flex: none; color: var(--accent)}
.st-server[hidden]{display:none}

.st-status{
  min-height: 22px;
  margin-bottom: 16px;
  color: var(--text-secondary);
  font-size: 14px;
  transition: opacity 0.3s var(--ease);
}
.st-status.is-fading{opacity: 0}

.st-speed{
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 10px;
  min-height: 120px;
  font-size: clamp(64px, 13vw, 116px);
  font-weight: 650;
  letter-spacing: -0.05em;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  transition: opacity 0.3s var(--ease);
}
.st-speed.is-fading{opacity: 0}
.st-speed.is-idle{opacity: 0}
.st-speed-unit{
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--text-secondary);
}

.st-start{
  width: 160px;
  height: 160px;
  margin-top: 32px;
  border-radius: 50%;
  border: 2px solid rgba(0,244,60,0.45);
  background: #0b2f14;
  color: var(--accent);
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.3s var(--ease), background 0.3s var(--ease), box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
}
.st-start:hover:not(:disabled){
  transform: scale(1.04);
  background: #0e3d19;
  border-color: rgba(0,244,60,0.7);
  box-shadow: 0 0 60px rgba(0,244,60,0.18);
}
.st-start:active:not(:disabled){transform: scale(0.97)}
.st-start:disabled{cursor: default; opacity: 0.55}
.st-start:focus-visible{outline: 3px solid var(--accent); outline-offset: 4px}
.st-start-idle{
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.12em;
}
.st-start-server, .st-start-label{display: none}
.st-start.is-server .st-start-idle{display: none}
.st-start.is-server .st-start-server{
  display: block;
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 0 12px rgba(0,244,60,0.35));
}
.st-start.is-server .st-start-label{
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--accent);
}

.st-results{
  margin-top: 44px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.st-card{
  background: #0d0d0d;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 20px 10px;
}
.st-label{
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}
.st-value{
  min-height: 30px;
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  transition: opacity 0.3s var(--ease);
}
.st-value.is-idle{opacity: 0}
.st-value small{
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-left: 4px;
}

.st-graph{
  height: 150px;
  margin-top: 14px;
  background: #0d0d0d;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.4s var(--ease);
}
.st-graph.is-visible{opacity: 1}
.st-graph canvas{display: block; width: 100%; height: 100%}

.st-info{
  margin-top: 16px;
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  color: var(--text-secondary);
  font-size: 13px;
}
.st-info strong{color: var(--text); font-weight: 500}
.st-jitter-value{transition: opacity 0.3s var(--ease)}
.st-jitter-value.is-idle{opacity: 0}

/* ─── Análise de rede ─── */
.st-analysis{display: none; text-align: left; margin-top: 36px; border-top: 1px solid var(--border); padding-top: 26px}
.st-analysis.is-visible{display: block; animation: stReveal 0.45s var(--ease)}
.st-analysis-title{font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px}
.st-an-summary{font-size: 15px; color: var(--text); margin-bottom: 16px; line-height: 1.6}
.st-an-grid{display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 14px}
.st-an-row dt{font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px}
.st-an-row dd{margin: 0; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.45}
.st-an-row dd span{font-weight: 600}
.st-an-note{font-size: 13.5px; color: var(--text-secondary); line-height: 1.8}
.st-an-note .st-ok{color: #4ade80}
.st-an-note .st-bad{color: #f87171}
.st-an-label{font-weight: 600; color: var(--text-secondary)}
.st-an-label.st-ok{color: #4ade80}
.st-an-label.st-bad{color: #f87171}

/* Cards/gráfico/info só aparecem ao iniciar o teste */
.st-lower{display:none}
.st-lower.is-open{display:block; animation: stReveal 0.45s var(--ease)}
@keyframes stReveal{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

@media(max-width: 768px){
  .speedtest-section{padding: 16px 0 80px 0}
  .st-app{padding: 28px 20px 24px; border-radius: 16px}
  .st-start{width: 140px; height: 140px; margin-top: 28px}
  .st-results{gap: 8px}
  .st-card{padding: 16px 4px}
  .st-value{font-size: 19px}
  .st-info{gap: 16px}
  .st-an-grid{grid-template-columns: repeat(2, 1fr)}
}

<script>
"use strict";

/* ==========================================================
   MOTOR (idêntico ao engine OpenSpeedTest-like)
   speedtest.nexuspt.eu — /downloading e /upload
   ========================================================== */

const SERVERS_JSON_URL = "https://kikalabs-server.nexuspt.eu/json/site-nxweb/speedtest.json";
/* Fallback quando a lista (speedtest.json) não carrega */
const DEFAULT_SERVER = {
  name: "speedcheck.digi.pt",
  url: "https://speedcheck.digi.pt",
  location: "Portugal",
  priority: false
};

let selectedServer = DEFAULT_SERVER;
let SERVER = selectedServer.url;
let DOWNLOAD_URL = SERVER + "/downloading";
let UPLOAD_URL = SERVER + "/upload";

const DOWNLOAD_THREADS = 6;
const UPLOAD_THREADS = 6;
const DOWNLOAD_DURATION = 12;
const UPLOAD_DURATION = 12;
const DOWNLOAD_DELAY = 300;
const UPLOAD_DELAY = 300;
const PING_SAMPLES = 10;
const PING_TIMEOUT = 5000;
const UPLOAD_DATA_SIZE = 30;
const DOWNLOAD_ADJUST = 1.04;
const UPLOAD_ADJUST = 1.04;

/* ==========================================================
   ELEMENTOS
   ========================================================== */

const startButton = document.getElementById("start");
const appBox = startButton.closest(".st-app");
const lowerBox = document.querySelector(".st-lower");
const serverElement = document.getElementById("serverInfo");
const startLabel = startButton.querySelector(".st-start-label");
const startIdle = startButton.querySelector(".st-start-idle");
const serverName = document.getElementById("serverName");
const statusElement = document.getElementById("status");
const speedElement = document.getElementById("speed");
const speedBox = speedElement.closest(".st-speed");
const downloadElement = document.getElementById("download");
const downloadBox = downloadElement.closest(".st-value");
const uploadElement = document.getElementById("upload");
const uploadBox = uploadElement.closest(".st-value");
const pingElement = document.getElementById("ping");
const pingBox = pingElement.closest(".st-value");
const jitterElement = document.getElementById("jitter");
const jitterBox = jitterElement.closest(".st-jitter-value");
const threadsElement = document.getElementById("threads");
const dataElement = document.getElementById("data");
const canvas = document.getElementById("graph");
const graphBox = canvas.parentElement;
const ctx = canvas.getContext("2d");

/* ==========================================================
   ESTADO
   ========================================================== */

let running = false;
let graphTimer = null;
let graphValues = [];
let totalBytes = 0;
let testValues = { ping: 0, jitter: 0, download: 0, upload: 0 };

resetValues();

/* i18n das strings dinâmicas do motor (EN quando ativo) */
const SPEED_I18N = {
  "INICIAR": "START",
  "A TESTAR": "TESTING",
  "REPETIR": "RETEST",
  "TENTAR NOVAMENTE": "TRY AGAIN",
  "A escolher servidor...": "Choosing server...",
  "A medir ping...": "Measuring ping...",
  "A testar download...": "Testing download...",
  "Download concluído": "Download complete",
  "A preparar upload...": "Preparing upload...",
  "A testar upload...": "Testing upload...",
  "Teste concluído": "Test complete",
  "Erro durante o teste": "Error during test"
};
function tx(s) {
  return (window.NexusI18n && window.NexusI18n.lang === "en" && SPEED_I18N[s]) ? SPEED_I18N[s] : s;
}

/* ==========================================================
   CANVAS
   ========================================================== */

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGraph();
}

function drawGraph() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  ctx.clearRect(0, 0, width, height);

  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = height * i / 4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }

  if (graphValues.length < 2) return;

  const max = Math.max(100, ...graphValues);
  ctx.beginPath();
  graphValues.forEach((value, index) => {
    const x = index / (graphValues.length - 1) * width;
    const y = height - (value / max) * height;
    if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = "#00f43c";
  ctx.lineWidth = 2;
  ctx.stroke();
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

/* ==========================================================
   HELPERS
   ========================================================== */

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

/* Equivalente a Promise.allSettled para browsers antigos */
function allSettled(promises) {
  return Promise.all(promises.map(function (p) {
    return Promise.resolve(p).then(
      function (value) { return { status: "fulfilled", value: value }; },
      function (reason) { return { status: "rejected", reason: reason }; }
    );
  }));
}
function fadeSwap(el, text, classTarget) {
  const t = classTarget || el;
  if (t._fadeTimer) clearTimeout(t._fadeTimer);
  t.classList.add("is-fading");
  t._fadeTimer = setTimeout(function () {
    el.textContent = text;
    t.classList.remove("is-fading");
    t._fadeTimer = null;
  }, 150);
}

function setStatus(text) { fadeSwap(statusElement, tx(text)); }

function setLiveSpeed(value) {
  if (!Number.isFinite(value) || value < 0) return;
  const formatted = value < 1 ? value.toFixed(2) : value.toFixed(1);
  if (speedElement.textContent === "") {
    /* a passagem is-idle → visível já é o fade; escrever direto */
    speedBox.classList.remove("is-idle");
    speedElement.textContent = formatted;
  } else {
    speedElement.textContent = formatted;
  }
  graphValues.push(value);
  if (graphValues.length > 120) graphValues.shift();
  if (graphValues.length === 1) graphBox.classList.add("is-visible");
  drawGraph();
}

function updateData() {
  dataElement.textContent = (totalBytes / 1048576).toFixed(1);
}

/* Estado de repouso: valores vazios + contentores invisíveis (espaço reservado) */
function resetValues() {
  speedElement.textContent = "";
  downloadElement.textContent = "";
  uploadElement.textContent = "";
  pingElement.textContent = "";
  jitterElement.textContent = "";
  [speedBox, downloadBox, uploadBox, pingBox, jitterBox].forEach(function (b) {
    b.classList.add("is-idle");
  });
}

/* ==========================================================
   PING
   ========================================================== */

function pingOnce() {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const start = performance.now();
    xhr.open("GET", UPLOAD_URL + "?n=" + Math.random(), true);
    xhr.timeout = PING_TIMEOUT;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 400) resolve(performance.now() - start);
      else reject(new Error("HTTP " + xhr.status));
    };
    xhr.onerror = function () { reject(new Error("Network error")); };
    xhr.ontimeout = function () { reject(new Error("Timeout")); };
    try { xhr.send(); } catch (error) { reject(error); }
  });
}

async function runPing() {
  setStatus("A medir ping...");
  const samples = [];
  for (let i = 0; i < PING_SAMPLES; i++) {
    try {
      const result = await pingOnce();
      if (Number.isFinite(result) && result > 0) {
        samples.push(result);
        pingBox.classList.remove("is-idle");
        pingElement.textContent = result.toFixed(1);
      }
    } catch (error) { console.warn("Ping:", error); }
    await sleep(40);
  }
  if (samples.length === 0) throw new Error("PING_FAILED");

  const ping = Math.min(...samples);
  const differences = [];
  for (let i = 1; i < samples.length; i++) {
    differences.push(Math.abs(samples[i] - samples[i - 1]));
  }
  differences.sort((a, b) => a - b);
  const count = Math.max(1, Math.ceil(differences.length * 0.5));
  const selected = differences.slice(0, count);
  const jitter = selected.length ? selected.reduce((t, v) => t + v, 0) / selected.length : 0;

  pingBox.classList.remove("is-idle");
  jitterBox.classList.remove("is-idle");
  pingElement.textContent = ping.toFixed(1);
  jitterElement.textContent = jitter.toFixed(1);
  testValues.ping = ping;
  testValues.jitter = jitter;
  return { ping, jitter };
}

/* ==========================================================
   DOWNLOAD WORKER
   ========================================================== */

function downloadWorker(endTime, counters) {
  return new Promise(resolve => {
    let xhr = null;
    let lastLoaded = 0;
    let finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      try { if (xhr) xhr.abort(); } catch {}
      resolve();
    }

    function startRequest() {
      if (finished || performance.now() >= endTime) { finish(); return; }

      xhr = new XMLHttpRequest();
      lastLoaded = 0;
      xhr.open("GET", DOWNLOAD_URL + "?n=" + Math.random(), true);
      xhr.responseType = "arraybuffer";

      xhr.onprogress = function (event) {
        if (finished) return;
        const loaded = event.loaded;
        if (!Number.isFinite(loaded) || loaded < lastLoaded) return;
        const delta = loaded - lastLoaded;
        lastLoaded = loaded;
        if (delta > 0) { counters.bytes += delta; totalBytes += delta; }
      };

      xhr.onload = function () {
        if (finished) return;
        if (performance.now() < endTime) startRequest(); else finish();
      };
      xhr.onerror = function () {
        if (finished) return;
        if (performance.now() < endTime) setTimeout(startRequest, 50); else finish();
      };
      xhr.ontimeout = function () {
        if (finished) return;
        if (performance.now() < endTime) setTimeout(startRequest, 50); else finish();
      };
      xhr.onabort = function () {
        if (performance.now() >= endTime) finish();
        else if (!finished) setTimeout(startRequest, 50);
      };

      try { xhr.send(); } catch (error) {
        console.warn("Download send:", error);
        if (performance.now() < endTime) setTimeout(startRequest, 50); else finish();
      }
    }

    startRequest();
  });
}

/* ==========================================================
   DOWNLOAD
   ========================================================== */

async function runDownload() {
  setStatus("A testar download...");
  threadsElement.textContent = DOWNLOAD_THREADS;

  const startTime = performance.now();
  const endTime = startTime + DOWNLOAD_DURATION * 1000;
  const counters = { bytes: 0 };
  let lastBytes = 0;
  let lastTime = performance.now();
  const samples = [];
  const workers = [];

  for (let i = 0; i < DOWNLOAD_THREADS; i++) {
    workers.push(new Promise(resolve => {
      setTimeout(function () {
        downloadWorker(endTime, counters).then(resolve).catch(error => {
          console.warn("Download worker:", error);
          resolve();
        });
      }, i * DOWNLOAD_DELAY);
    }));
  }

  graphTimer = setInterval(function () {
    try {
      const now = performance.now();
      const elapsed = (now - lastTime) / 1000;
      if (elapsed <= 0) return;
      const delta = counters.bytes - lastBytes;
      const speed = delta / elapsed / 125000;
      const testElapsed = (now - startTime) / 1000;
      if (Number.isFinite(speed) && speed > 0) {
        if (testElapsed >= 4) samples.push(speed);
        setLiveSpeed(speed * DOWNLOAD_ADJUST);
      }
      lastBytes = counters.bytes;
      lastTime = now;
      updateData();
    } catch (error) { console.warn("Download meter:", error); }
  }, 100);

  await allSettled(workers);

  clearInterval(graphTimer);
  graphTimer = null;

  let result = 0;
  if (samples.length > 0) {
    result = samples.reduce((t, v) => t + v, 0) / samples.length;
  } else {
    const elapsed = (performance.now() - startTime) / 1000;
    if (elapsed > 0) result = counters.bytes / elapsed / 125000;
  }
  result *= DOWNLOAD_ADJUST;

  if (!Number.isFinite(result) || result <= 0) throw new Error("DOWNLOAD_FAILED");

  downloadBox.classList.remove("is-idle");
  speedBox.classList.remove("is-idle");
  downloadElement.textContent = result.toFixed(1);
  speedElement.textContent = result.toFixed(1);
  testValues.download = result;
  updateData();
  return result;
}

/* ==========================================================
   PAYLOAD UPLOAD
   ========================================================== */

function createUploadBlob() {
  const size = UPLOAD_DATA_SIZE * 1024 * 1024;
  const buffer = new Uint8Array(size);
  const chunk = 65536;
  for (let offset = 0; offset < size; offset += chunk) {
    const length = Math.min(chunk, size - offset);
    const piece = new Uint8Array(buffer.buffer, offset, length);
    crypto.getRandomValues(piece);
  }
  return new Blob([buffer], { type: "application/octet-stream" });
}

/* ==========================================================
   UPLOAD WORKER
   ========================================================== */

function uploadWorker(blob, endTime, counters) {
  return new Promise(resolve => {
    let xhr = null;
    let lastLoaded = 0;
    let finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      try { if (xhr) xhr.abort(); } catch {}
      resolve();
    }

    function startRequest() {
      if (finished || performance.now() >= endTime) { finish(); return; }

      xhr = new XMLHttpRequest();
      lastLoaded = 0;
      xhr.open("POST", UPLOAD_URL + "?n=" + Math.random(), true);
      xhr.setRequestHeader("Content-Type", "application/octet-stream");

      xhr.upload.onprogress = function (event) {
        if (finished) return;
        const loaded = event.loaded;
        if (!Number.isFinite(loaded) || loaded < lastLoaded) return;
        const delta = loaded - lastLoaded;
        lastLoaded = loaded;
        if (delta > 0) { counters.bytes += delta; totalBytes += delta; }
      };

      xhr.onload = function () {
        if (finished) return;
        if (performance.now() < endTime) startRequest(); else finish();
      };
      xhr.onerror = function () {
        if (finished) return;
        console.warn("Upload request error");
        if (performance.now() < endTime) setTimeout(startRequest, 50); else finish();
      };
      xhr.ontimeout = function () {
        if (finished) return;
        if (performance.now() < endTime) setTimeout(startRequest, 50); else finish();
      };
      xhr.onabort = function () {
        if (performance.now() >= endTime) finish();
        else if (!finished) setTimeout(startRequest, 50);
      };

      try { xhr.send(blob); } catch (error) {
        console.warn("Upload send:", error);
        if (performance.now() < endTime) setTimeout(startRequest, 100); else finish();
      }
    }

    startRequest();
  });
}

/* ==========================================================
   UPLOAD
   ========================================================== */

async function runUpload() {
  setStatus("A preparar upload...");
  threadsElement.textContent = UPLOAD_THREADS;

  let blob;
  try {
    blob = createUploadBlob();
  } catch (error) {
    console.error("Erro a criar upload:", error);
    throw new Error("UPLOAD_PAYLOAD_FAILED");
  }

  setStatus("A testar upload...");

  const startTime = performance.now();
  const endTime = startTime + UPLOAD_DURATION * 1000;
  const counters = { bytes: 0 };
  let lastBytes = 0;
  let lastTime = performance.now();
  const samples = [];
  const workers = [];

  for (let i = 0; i < UPLOAD_THREADS; i++) {
    workers.push(new Promise(resolve => {
      setTimeout(function () {
        uploadWorker(blob, endTime, counters).then(resolve).catch(error => {
          console.warn("Upload worker:", error);
          resolve();
        });
      }, i * UPLOAD_DELAY);
    }));
  }

  graphTimer = setInterval(function () {
    try {
      const now = performance.now();
      const elapsed = (now - lastTime) / 1000;
      if (elapsed <= 0) return;
      const delta = counters.bytes - lastBytes;
      const speed = delta / elapsed / 125000;
      const testElapsed = (now - startTime) / 1000;
      if (Number.isFinite(speed) && speed > 0) {
        if (testElapsed >= 4) samples.push(speed);
        setLiveSpeed(speed * UPLOAD_ADJUST);
      }
      lastBytes = counters.bytes;
      lastTime = now;
      updateData();
    } catch (error) { console.warn("Upload meter:", error); }
  }, 100);

  await allSettled(workers);

  clearInterval(graphTimer);
  graphTimer = null;

  let result = 0;
  if (samples.length > 0) {
    result = samples.reduce((t, v) => t + v, 0) / samples.length;
  } else {
    const elapsed = (performance.now() - startTime) / 1000;
    if (elapsed > 0) result = counters.bytes / elapsed / 125000;
  }
  result *= UPLOAD_ADJUST;

  if (!Number.isFinite(result) || result <= 0) throw new Error("UPLOAD_FAILED");

  uploadBox.classList.remove("is-idle");
  speedBox.classList.remove("is-idle");
  uploadElement.textContent = result.toFixed(1);
  speedElement.textContent = result.toFixed(1);
  testValues.upload = result;
  updateData();
  return result;
}

/* ==========================================================
   ANÁLISE DE REDE — thresholds:
   Download ≥100/25/10 · Upload ≥20/10/2 · Ping ≤20/50/100 · Jitter ≤5/10/20
   ========================================================== */

const analysisElement = document.getElementById("analysis");

function rateMetric(value, thresholds, betterHigh) {
  const labels = [tx("Excelente"), tx("Bom"), tx("Razoável"), tx("Fraco")];
  for (let i = 0; i < thresholds.length; i++) {
    const ok = betterHigh ? value >= thresholds[i] : value <= thresholds[i];
    if (ok) return { level: i, label: labels[i] };
  }
  return { level: thresholds.length, label: labels[thresholds.length] };
}

function analyzeConnection(d, u, p, j) {
  const dl = rateMetric(d, [100, 25, 10], true);
  const ul = rateMetric(u, [20, 10, 2], true);
  const ping = rateMetric(p, [20, 50, 100], false);
  const jitter = rateMetric(j, [5, 10, 20], false);

  const worst = Math.max(dl.level, ul.level, ping.level, jitter.level);
  const verdictHead = [
    tx("Ligação excelente, pronta para qualquer uso."),
    tx("Boa ligação, adequada para a maioria das atividades."),
    tx("Ligação razoável, com limitações em tarefas exigentes."),
    tx("Ligação fraca, com problemas prováveis no dia a dia.")
  ][worst];

  const limiting = [
    { level: ping.level, name: tx("Ping") },
    { level: jitter.level, name: tx("Jitter") },
    { level: dl.level, name: tx("Download") },
    { level: ul.level, name: tx("Upload") }
  ].sort(function (a, b) { return b.level - a.level; })[0];

  const why = tx("O ponto mais fraco é o ") + limiting.name + ".";

  return { dl: dl, ul: ul, ping: ping, jitter: jitter, worst: worst, verdictHead: verdictHead, why: why };
}

function renderAnalysis(a, values) {
  const esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  const rows = [
    { name: tx("Download"), value: values.d, label: a.dl.label },
    { name: tx("Upload"), value: values.u, label: a.ul.label },
    { name: tx("Ping"), value: values.p, label: a.ping.label },
    { name: tx("Jitter"), value: values.j, label: a.jitter.label }
  ].map(function (m) {
    const cls = m.label === "Excelente" ? " st-ok" : m.label === "Fraco" ? " st-bad" : "";
    return '<div class="st-an-row"><dt>' + esc(m.name) + '</dt><dd>' + esc(m.value) +
      " \u00b7 <span class=\"st-an-label" + cls + "\">" + esc(m.label) + "</span></dd></div>";
  }).join("");

  analysisElement.innerHTML =
    '<h3 class="st-analysis-title">' + esc(tx("Análise de rede")) + "</h3>" +
    '<p class="st-an-summary">' + esc(a.verdictHead) + "</p>" +
    '<dl class="st-an-grid">' + rows + "</dl>" +
    (a.worst >= 2 ? '<p class="st-an-note">' + esc(a.why) + "</p>" : "");

  analysisElement.hidden = false;
  analysisElement.classList.add("is-visible");
}

/* ==========================================================
   TESTE COMPLETO
   ========================================================== */

async function runTest() {
  if (running) return;
  running = true;

  startButton.disabled = true;
  startButton.classList.add("is-server");
  startLabel.textContent = tx("A TESTAR");

  resetValues();
  appBox.classList.remove("is-idle");
  lowerBox.classList.add("is-open");
  requestAnimationFrame(resizeCanvas);
  dataElement.textContent = "0";
  graphValues = [];
  totalBytes = 0;
  testValues = { ping: 0, jitter: 0, download: 0, upload: 0 };
  graphBox.classList.remove("is-visible");
  drawGraph();
  analysisElement.hidden = true;
  analysisElement.classList.remove("is-visible");
  analysisElement.innerHTML = "";

  try {
    setStatus("A escolher servidor...");
    await serverSelection;

    try {
      await runPing();
    } catch (error) {
      /* Uma falha transitória no ping não devolve matar o teste */
      console.warn("[NexusPT] Ping falhou, a repetir...", error && error.message);
      await sleep(400);
      await runPing();
    }
    await sleep(300);

    let download;
    try { download = await runDownload(); }
    catch (error) { throw new Error("STAGE_DOWNLOAD: " + (error && error.message)); }
    console.log("[NexusPT] Download:", download, "Mbps");
    setStatus("Download concluído");
    await sleep(1000);

    let upload;
    try { upload = await runUpload(); }
    catch (error) {
      /* O servidor entra às vezes em manutenção a meio do teste; repetir uma vez */
      console.warn("[NexusPT] Upload falhou, a repetir fase...", error && error.message);
      await sleep(1500);
      try { upload = await runUpload(); }
      catch (error2) { throw new Error("STAGE_UPLOAD: " + (error2 && error2.message)); }
    }
    console.log("[NexusPT] Upload:", upload, "Mbps");

    setStatus("Teste concluído");
    speedElement.textContent = upload.toFixed(1);
    startLabel.textContent = tx("REPETIR");

    /* Análise de rede */
    renderAnalysis(
      analyzeConnection(testValues.download, testValues.upload, testValues.ping, testValues.jitter),
      { d: testValues.download.toFixed(2), u: testValues.upload.toFixed(2), p: testValues.ping.toFixed(1), j: testValues.jitter.toFixed(2) }
    );
  } catch (error) {
    console.error("[NexusPT Speed Test]", error);
    if (error && error.message) console.error("Código:", error.message);
    const msg = error && error.message ? String(error.message) : "";
    if (msg.indexOf("STAGE_") === 0) {
      console.warn("[NexusPT] Fase que falhou:", msg.split(":")[0].replace("STAGE_", ""), "| servidor:", SERVER);
    }
    setStatus("Erro durante o teste");
    startLabel.textContent = tx("TENTAR NOVAMENTE");
  }

  running = false;
  startButton.disabled = false;
}

startButton.addEventListener("click", runTest);

document.addEventListener("keydown", function (event) {
  if (event.key === "Enter" && !running && document.activeElement === document.body) {
    runTest();
  }
});

/* ==========================================================
   SELEÇÃO DE SERVIDOR
   Lista editável em kikalabs-server (speedtest.json):
   [{ name, url, location (distrito PT), priority }]
   Escolha: distrito do utilizador (via IP) → match exato;
   sem match, o servidor com priority sai ~80% das vezes.
   ========================================================== */

function normText(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
}

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, ms);
  return fetch(url, { cache: "no-cache", signal: ctrl.signal }).finally(function () { clearTimeout(timer); });
}

async function fetchServerList() {
  try {
    const res = await fetchWithTimeout(SERVERS_JSON_URL, 4000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = await res.json();
    const valid = Array.isArray(list)
      ? list.filter(function (s) { return s && typeof s.url === "string" && /^https?:\/\//.test(s.url); })
      : [];
    if (valid.length > 0) return valid;
    throw new Error("Lista vazia ou inválida");
  } catch (error) {
    console.warn("[NexusPT] speedtest.json indisponível, a usar servidor por omissão:", error.message);
    return [DEFAULT_SERVER];
  }
}

async function getUserRegion() {
  try {
    const res = await fetchWithTimeout("https://ipwho.is/", 2500);
    const info = await res.json();
    if (info && info.region) return info.region;
  } catch (error) { /* tentar o próximo provider */ }
  try {
    const res = await fetchWithTimeout("https://ipapi.co/json/", 2500);
    const info = await res.json();
    if (info && info.region) return info.region;
  } catch (error) { /* sem geolocalização disponível */ }
  return null;
}

function pickServer(list, region) {
  if (list.length === 1) return list[0];

  if (region) {
    const wanted = normText(region);
    const match = list.find(function (s) { return normText(s.location) === wanted; });
    if (match) return match;
  }

  const priority = list.filter(function (s) { return s.priority; });
  const others = list.filter(function (s) { return !s.priority; });

  /* Sem match de distrito: priority sai na maioria das vezes (~80%) */
  if (priority.length > 0 && others.length > 0) {
    if (Math.random() < 0.8) {
      return priority[Math.floor(Math.random() * priority.length)];
    }
    return others[Math.floor(Math.random() * others.length)];
  }

  const pool = priority.length > 0 ? priority : list;
  return pool[Math.floor(Math.random() * pool.length)];
}

function applyServer(server) {
  selectedServer = server || DEFAULT_SERVER;
  SERVER = String(selectedServer.url || DEFAULT_SERVER.url).replace(/\/+$/, "");
  DOWNLOAD_URL = SERVER + "/downloading";
  UPLOAD_URL = SERVER + "/upload";
}

/* Nome a mostrar: o speedcheck.digi.pt fica em Lisboa */
function serverDisplayName(server) {
  if (/speedcheck\.digi\.pt/i.test(String(server && server.url))) return "Lisboa, Portugal";
  return String((server && server.name) || "");
}

let serverSelection = (async function () {
  const list = await fetchServerList();
  const region = await getUserRegion();
  applyServer(pickServer(list, region));
  const firstChoice = selectedServer;

  /* Confirmar que o servidor responde; senão experimentar os restantes */
  try {
    await pingOnce();
  } catch (error) {
    let working = false;
    for (const alt of list) {
      if (normText(alt.url) === normText(firstChoice.url)) continue;
      applyServer(alt);
      try { await pingOnce(); working = true; break; } catch (e) { /* próximo servidor */ }
    }
    if (!working) {
      applyServer(firstChoice);
      throw new Error("SERVER_UNREACHABLE");
    }
  }

  serverElement.hidden = false;
  serverName.textContent = serverDisplayName(selectedServer);
  console.info("[NexusPT] Servidor:", selectedServer.name, "(" + SERVER + ")", region ? "| região: " + region : "| região desconhecida");
  return selectedServer;
})().catch(function () {
  serverElement.hidden = true;
  return selectedServer;
});
