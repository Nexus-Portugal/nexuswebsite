<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWeb - Contacto</title>
    <meta name="description" content="Entre em contacto com a NexusWeb para soluções digitais inovadoras e personalizadas.">
    <meta name="keywords" content="NexusWeb, contacto, inovação digital, soluções personalizadas">
    <meta name="author" content="NexusWeb">
    <link rel="canonical" href="https://nexusweb.netlify.app/contacto">
    <meta property="og:title" content="NexusWeb - Contacte-nos">
    <meta property="og:description" content="Entre em contacto connosco para transformar as suas ideias em realidade digital.">
    <meta property="og:image" content="https://kikalabs-app-server-static.netlify.app/images/site-nxweb/RealNexusWeb.png">
    <meta property="og:url" content="https://nexusweb.netlify.app/contacto">
    <meta name="twitter:card" content="summary_large_image">
    <script src="https://kikalabs-app-server-static.netlify.app/js/site-nxweb/ads.js"></script>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7772613538554309"
     crossorigin="anonymous"></script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #00ff00;
            --secondary: #00ccff;
            --dark: #121212;
            --light: #f8f8f8;
            --transition: all 0.3s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--secondary));
            border-radius: 5px;
            animation: scrollColorChange 3s ease-in-out infinite alternate;
        }

        @keyframes scrollColorChange {
            from { background: linear-gradient(var(--primary), var(--secondary)); }
            to { background: linear-gradient(var(--secondary), var(--primary)); }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .sticky-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            transition: var(--transition);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 180px;
            height: 40px;
            background-image: url('https://kikalabs-app-server-static.netlify.app/images/site-nxweb/RealNexusWeb.png');
            background-size: contain;
            background-repeat: no-repeat;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.05);
        }


        .content {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
        }

        .video-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        #video-bg {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.3), rgba(18, 18, 18, 0.8));
        }

        .contact-form-container {
            position: relative;
            z-index: 10;
            background-color: rgba(18, 18, 18, 0.6); /* Mais transparente */
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            animation: glowingBorder 5s ease-in-out infinite alternate;
        }

        @keyframes glowingBorder {
            0% { box-shadow: 0 0 8px rgba(0, 255, 0, 0.5), 0 0 12px rgba(0, 255, 204, 0.4); } /* Cores mais suaves */
            50% { box-shadow: 0 0 12px rgba(0, 204, 255, 0.4), 0 0 18px rgba(0, 153, 255, 0.3); }
            100% { box-shadow: 0 0 8px rgba(0, 255, 0, 0.5), 0 0 12px rgba(0, 255, 204, 0.4); }
        }

        .contact-form-container h2 {
            color: var(--light); /* Cor mais suave para o texto */
            margin-bottom: 20px;
            text-align: center;
            font-size: 2em;
            font-weight: 500; /* Peso da fonte mais leve */
        }

        iframe {
            width: 80%; /* Aumenta a largura */
            height: 600px; /* Aumenta a altura */
            border: none;
            border-radius: 10px; /* Bordas arredondadas */
        }

        @media (min-width: 769px) {
            #nav-btn {
                display: none; /* Esconde o menu hamburguer no desktop */
            }

            .navbar {
                display: flex; /* Mostra a navbar no desktop */
            }
        }

        @media (max-width: 768px) {
            .contact-form-container {
                width: 95%;
                padding: 20px;
            }
            .contact-form-container h2 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <!-- O menu será carregado dinamicamente via JS -->
    <header></header>
        <script src="https://kikalabs-app-server-static.netlify.app/js/site-nxweb/menu.js"></script>
    <div class="content">
        <div class="video-wrap">
            <video autoplay loop muted playsinline id="video-bg" loading="lazy">
                <source src="https://kikalabs-app-server-static.netlify.app/video/site-nxweb/backtech.mp4" type="video/mp4">
            </video>
            <div class="gradient-overlay"></div>
        </div>
        <iframe src="https://www.powr.io/contact-form/i/39120160#page" loading="lazy"></iframe>
    </div>

    <script>
        document.getElementById('nav-btn').addEventListener('click', function() {
            this.classList.toggle('active');
            document.getElementById('takeover-nav').classList.toggle('shown');
        });
    </script>
</body>
</html>
