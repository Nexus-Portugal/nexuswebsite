<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWeb - Contacto</title>
    <style>
        :root {
            --primary: #00ff00;
            --secondary: #00ccff;
            --dark: #121212;
            --light: #f8f8f8;
            --transition: all 0.3s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .sticky-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            transition: var(--transition);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 180px;
            height: 40px;
            background-image: url('https://kikalabs-app-server-static.netlify.app/images/site-nxweb/RealNexusWeb.png');
            background-size: contain;
            background-repeat: no-repeat;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        #nav-btn {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            background: none;
            border: none;
        }

        .nav-line {
            width: 100%;
            height: 3px;
            background-color: var(--light);
            transition: var(--transition);
        }

        #takeover-nav {
            position: fixed;
            width: 100%;
            height: 100vh;
            right: -100%;
            top: 0;
            transition: var(--transition);
            z-index: 999;
            background-color: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #takeover-nav.shown {
            right: 0;
        }

        .nav-items {
            list-style-type: none;
            text-align: center;
        }

        .nav-items li {
            margin-bottom: 2rem;
        }

        .nav-items a {
            color: var(--light);
            text-decoration: none;
            font-size: 2em;
            font-weight: 700;
            position: relative;
            transition: var(--transition);
        }

        .nav-items a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 50%;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .nav-items a:hover {
            color: var(--primary);
        }

        .nav-items a:hover::after {
            width: 100%;
            left: 0;
        }

        .content {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #video-bg {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            transform: scale(1);
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header>
        <nav class="sticky-nav">
            <div class="container nav-content">
                <div class="logo"></div>
                <button id="nav-btn">
                    <span class="nav-line"></span>
                    <span class="nav-line"></span>
                    <span class="nav-line"></span>
                </button>
            </div>
        </nav>

        <div id="takeover-nav">
            <ul class="nav-items">
                <li><a href="https://tvnexusweb.netlify.app">TV</a></li>
                <li><a href="https://nexuschat-5h38.onrender.com/login?next=%2F">NexusChat</a></li>
                <li><a href="https://sites.google.com/view/nexuswebdevelopment/servi%C3%A7os/nexus-browser">NexusBrowser</a></li>
                <li><a href="/contacto">Contacto</a></li>
            </ul>
        </div>
    </header>

    <div class="content">
        <div class="video-wrap">
            <video autoplay loop muted playsinline id="video-bg">
                <source src="https://kikalabs-app-server-static.netlify.app/video/site-nxweb/background.mp4" type="video/mp4">
            </video>
        </div>
        <iframe src="https://www.powr.io/contact-form/i/39120160#page"></iframe>
    </div>

    <script>
        document.getElementById('nav-btn').addEventListener('click', function() {
            this.classList.toggle('active');
            document.getElementById('takeover-nav').classList.toggle('shown');
        });

        function adjustIframeHeight() {
            const iframe = document.querySelector('iframe');
            const headerHeight = document.querySelector('.sticky-nav').offsetHeight;
            iframe.style.height = `calc(100vh - ${headerHeight}px)`;
        }

        window.addEventListener('load', adjustIframeHeight);
        window.addEventListener('resize', adjustIframeHeight);
    </script>
</body>
</html>
