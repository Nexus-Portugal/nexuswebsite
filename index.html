<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWeb - Inovação Digital</title>
    <style>
        :root {
            --primary: #00ff00;
            --secondary: #00ccff;
            --dark: #121212;
            --light: #f8f8f8;
            --transition: all 0.3s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .sticky-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            transition: var(--transition);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 180px;
            height: 40px;
            background-image: url('https://kikalabs-app-server-static.netlify.app/images/site-nxweb/RealNexusWeb.png');
            background-size: contain;
            background-repeat: no-repeat;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        #nav-btn {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            background: none;
            border: none;
        }

        .nav-line {
            width: 100%;
            height: 3px;
            background-color: var(--light);
            transition: var(--transition);
        }

        #takeover-nav {
            position: fixed;
            width: 100%;
            height: 100vh;
            right: -100%;
            top: 0;
            transition: var(--transition);
            z-index: 999;
            background-color: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #takeover-nav.shown {
            right: 0;
        }

        .nav-items {
            list-style-type: none;
            text-align: center;
        }

        .nav-items li {
            margin-bottom: 2rem;
        }

        .nav-items a {
            color: var(--light);
            text-decoration: none;
            font-size: 2em;
            font-weight: 700;
            position: relative;
            transition: var(--transition);
        }

        .nav-items a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 50%;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .nav-items a:hover {
            color: var(--primary);
        }

        .nav-items a:hover::after {
            width: 100%;
            left: 0;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #video-bg {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.3), rgba(18, 18, 18, 0.8));
        }

        .hero-content {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 0 20px;
        }

        .hero-title {
            font-size: 4.5em;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glowText 3s ease-in-out infinite alternate;
        }

        @keyframes glowText {
            from {
                text-shadow: 0 0 5px var(--primary), 0 0 10px var(--primary), 0 0 15px var(--primary);
            }
            to {
                text-shadow: 0 0 10px var(--secondary), 0 0 20px var(--secondary), 0 0 30px var(--secondary);
            }
        }

        .hero-subtitle {
            font-size: 1.5em;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .cta-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .cta-button {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: var(--transition);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-primary {
            background-color: var(--primary);
            color: var(--dark);
        }

        .cta-secondary {
            background-color: transparent;
            color: var(--light);
            border: 2px solid var(--light);
        }

        .cta-primary:hover {
            background-color: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 204, 255, 0.3);
        }

        .cta-secondary:hover {
            background-color: var(--light);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(248, 248, 248, 0.3);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 3em;
            }

            .hero-subtitle {
                font-size: 1.2em;
            }

            .cta-container {
                flex-direction: column;
            }

            .cta-button {
                width: 100%;
            }
        }
    </style>
    <link href="https://img.botschool.ai/cdn/chatui/chaticons.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="sticky-nav">
            <div class="container nav-content">
                <div class="logo"></div>
                <button id="nav-btn">
                    <span class="nav-line"></span>
                    <span class="nav-line"></span>
                    <span class="nav-line"></span>
                </button>
            </div>
        </nav>

        <div id="takeover-nav">
            <ul class="nav-items">
                <li><a href="https://tvnexusweb.netlify.app">TV</a></li>
                <li><a href="https://nexuschat-5h38.onrender.com/login?next=%2F">NexusChat</a></li>
                <li><a href="https://sites.google.com/view/nexuswebdevelopment/servi%C3%A7os/nexus-browser">NexusBrowser</a></li>
                <li><a href="/contacto">Contacto</a></li>
            </ul>
        </div>
    </header>

    <section class="hero">
        <div class="video-wrap">
            <video autoplay loop muted playsinline id="video-bg">
                <source src="https://kikalabs-app-server-static.netlify.app/video/site-nxweb/background.mp4" type="video/mp4">
            </video>
        </div>

        <div class="gradient-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title">Bem-vindo à NexusWeb</h1>
            <p class="hero-subtitle">Transformando ideias em realidade digital</p>
            <div class="cta-container">
                <button class="cta-button cta-primary">Explorar Serviços</button>
                <a href="/contacto" class="cta-button cta-secondary">Contacto</a>
            </div>
        </div>
    </section>

    <!-- Componente do chatbot BotSchool -->
    <chat-component
        data-chat-key="d8688ed616a1422a9e6bb863f05893cc"
        mic="false"
        assetsURL="https://img.botschool.ai/cdn/chatui/assets/"
        socket-url="https://api.botschool.ai/">
    </chat-component>

    <script src="https://img.botschool.ai/cdn/chatui/chat-component.js"></script>
    <script>
        document.getElementById('nav-btn').addEventListener('click', function() {
            this.classList.toggle('active');
            document.getElementById('takeover-nav').classList.toggle('shown');
        });

        window.addEventListener('scroll', function() {
            const nav = document.querySelector('.sticky-nav');
            nav.classList.toggle('scrolled', window.scrollY > 0);
        });
    </script>
</body>
</html>
