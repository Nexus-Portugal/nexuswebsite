<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rádio NexusPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg: #000;
  --surface: #0d0d0d;
  --text: #f5f5f7;
  --text2: #86868b;
  --text3: #6e6e73;
  --accent: #00f43c;
  --accent2: #00c9ff;
  --grad: linear-gradient(135deg, #00f43c, #00c9ff);
  --border: rgba(255,255,255,0.08);
  --glass: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.06);
  --glass-blur: blur(24px) saturate(160%);
  --glass-btn: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  --ease: cubic-bezier(0.42, 0, 0.58, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
html,body{height:100%;overflow:hidden}
body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ─── ET MODE ─── */
.et-bg{
  position: fixed;
  inset: 0;
  z-index: -1;
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 0.8s;
  pointer-events: none;
  filter: blur(40px) saturate(200%);
  -webkit-filter: blur(40px) saturate(200%);
}
.et-bg.on{opacity: 0.7}
.et-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--glass-btn);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.25s;
  margin: 0 4px 0 auto;
}
.et-btn:hover{border-color: rgba(255,255,255,0.2); color: var(--text)}
.et-btn.on{
  background: linear-gradient(135deg, rgba(0,244,60,0.25), rgba(0,201,255,0.2));
  border-color: rgba(0,244,60,0.35);
  box-shadow: 0 0 25px rgba(0,244,60,0.2);
}
.et-btn svg{width: 16px; height: 16px; display: block; stroke: currentColor}
body.et-mode{background: #080808}
body.et-mode .top{background: rgba(0,0,0,0.35); backdrop-filter: blur(60px) saturate(200%)}
body.et-mode .hist-wrap{background: rgba(255,255,255,0.04); backdrop-filter: blur(24px) saturate(180%); border-color: rgba(255,255,255,0.08)}
body.et-mode .cover-wrap{box-shadow: 0 0 60px rgba(0,244,60,0.1); border-color: rgba(0,244,60,0.15)}
body.et-mode .cover-wrap img{mix-blend-mode: screen}
body.et-mode .play{box-shadow: 0 0 40px rgba(0,244,60,0.15)}
body.et-mode .vu-fill{background: linear-gradient(135deg, #00f43c, #00c9ff)}

/* ─── LAYOUT FULLSCREEN ─── */
#app{
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px;
  transform: translateX(-100px);
}

/* ─── TOP BAR ─── */
.top{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px 8px;
  flex-shrink: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(60px) saturate(180%);
  -webkit-backdrop-filter: blur(60px) saturate(180%);
  border-radius: 0 0 16px 16px;
  margin: 0 -24px;
}
.top-left{
  display: flex;
  align-items: center;
  gap: 8px;
}
.back-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: var(--text2);
  text-decoration: none;
  transition: all 0.25s var(--ease);
  background: var(--glass-btn);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
}
.back-btn:hover{
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.15);
  color: var(--text);
  transform: scale(1.05);
}
.brand{font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.01em}
.rec{
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.rec.on{animation: pulse 1.8s ease-in-out infinite}
.rec.off{opacity: 0.12}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
.status{
  margin-left: auto;
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
}
.status.ok{color: var(--accent)}
.status.err{color: #ff4444}
.status.buf{color: #ffd60a}

/* ─── MAIN CONTENT (flex, fills space) ─── */
.main{
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  min-height: 0;
  gap: 24px;
  padding: 0;
}
.player-col{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-width: 0;
  min-height: 0;
  padding: 16px 0;
}

/* ─── COVER ─── */
@keyframes liquidShift{
  0%, 100%{transform: translate(-10%, -10%) rotate(0deg); opacity: 0.6}
  50%{transform: translate(10%, 10%) rotate(5deg); opacity: 1}
}
@keyframes glassPulse{
  0%,100%{box-shadow: 0 0 20px rgba(0,244,60,0.05)}
  50%{box-shadow: 0 0 40px rgba(0,244,60,0.12)}
}

.cover-wrap{
  width: 100%;
  max-width: 340px;
  aspect-ratio: 1;
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface);
  position: relative;
  flex-shrink: 0;
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.cover-wrap .ph{
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--glass);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: opacity 0.4s;
}
.cover-wrap .ph.hide{opacity: 0; pointer-events: none}
.cover-wrap .ph svg{width: 56px; height: 56px; color: var(--text3); opacity: 0.15}
.cover-wrap img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.5s;
}

/* ─── TRACK INFO ─── */
.info{
  text-align: center;
  padding: 16px 0 12px;
  width: 100%;
  max-width: 400px;
}
.track{
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track.ph{color: var(--text3); font-weight: 400}
.artist{
  font-size: 14px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
}

/* ─── VU + CONTROLS ─── */
.vu-wrap{
  width: 100%;
  max-width: 340px;
  padding-bottom: 14px;
}
.vu-track{
  height: 3px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
}
.vu-fill{
  height: 100%;
  width: 0%;
  background: var(--grad);
  border-radius: 2px;
  transition: width 0.2s;
}

.ctrls{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-bottom: 6px;
}
.ctrls button{
  width: 44px; height: 44px;
  border: 1px solid var(--glass-border);
  background: var(--glass-btn);
  backdrop-filter: blur(12px) saturate(160%);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.25s var(--ease);
  position: relative;
  overflow: hidden;
}
.ctrls button::before{
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
  pointer-events: none;
  border-radius: inherit;
}
.ctrls button:hover:not(:disabled){
  border-color: rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  transform: scale(1.06);
}
.ctrls button:active:not(:disabled){transform: scale(0.9)}
.ctrls button:disabled{opacity: 0.12; cursor: default}
.ctrls .play{
  width: 60px; height: 60px;
  background: linear-gradient(135deg, rgba(0,244,60,0.15), rgba(0,201,255,0.1));
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  color: #fff;
  border: 1px solid rgba(0,244,60,0.2);
}
.ctrls .play::before{
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%, rgba(255,255,255,0.03) 80%);
  pointer-events: none;
  border-radius: inherit;
}
.ctrls .play::after{
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 50%);
  animation: liquidShift 6s ease-in-out infinite;
  pointer-events: none;
  border-radius: inherit;
}
.ctrls .play:hover:not(:disabled){
  box-shadow: 0 0 40px rgba(0,244,60,0.2);
  transform: scale(1.05);
  border-color: rgba(0,244,60,0.3);
}
.ctrls .play:active:not(:disabled){transform: scale(0.93)}
.ctrls .play svg{width: 24px; height: 24px}

.vol-wrap{
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  width: 100%;
  max-width: 340px;
  padding-top: 12px;
}
.vol-icon{width: 16px; height: 16px; color: var(--text3); display: flex; align-items: center; flex-shrink: 0}
.vol-icon svg{width: 100%; height: 100%}
.vol-wrap input[type="range"]{
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.vol-wrap input::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 14px; height: 14px;
  background: var(--text);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  cursor: pointer;
  box-shadow: 0 0 12px rgba(255,255,255,0.08);
}
.vol-wrap input::-moz-range-thumb{
  width: 14px; height: 14px;
  background: var(--text);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  cursor: pointer;
}
.vol-pct{
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  min-width: 28px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ─── HISTORY ─── */
.hist-wrap{
  width: 200px;
  display: flex;
  flex-direction: column;
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  padding: 16px;
  flex-shrink: 0;
}
.hist-hdr{
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
  flex-shrink: 0;
}
.hist-list{
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--text3) transparent;
}
.hist-list::-webkit-scrollbar{width: 3px}
.hist-list::-webkit-scrollbar-track{background: transparent}
.hist-list::-webkit-scrollbar-thumb{background: var(--text3); border-radius: 2px}
.hist-item{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.hist-item .thmb{
  width: 32px; height: 32px;
  border-radius: 6px;
  flex-shrink: 0;
  background: var(--glass);
  object-fit: cover;
  display: block;
  border: 1px solid var(--glass-border);
}
.hist-item .thmb-fb{display:flex;align-items:center;justify-content:center}
.hist-item .thmb-fb svg{width:12px;height:12px;color:var(--text3);opacity:0.2}
.hist-item .hi{min-width:0;flex:1}
.hist-item .hi-t{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .hi-a{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* ─── MOBILE ─── */
@media(max-width: 768px){
  #app{padding: 0 16px; overflow: hidden}
  .top{padding: 10px 16px 4px; margin: 0 -16px; border-radius: 0 0 14px 14px; flex-shrink: 0}
  .top .back-btn{width: 28px; height: 28px}
  .brand{font-size: 12px}
  .et-btn{width: 28px; height: 28px; font-size: 10px; margin-right: 4px}
  .main{flex-direction: column; overflow-y: auto; gap: 8px}
  .player-col{gap: 0; width: 100%}
  .cover-wrap{max-width: 180px; border-radius: 12px}
  .cover-wrap .ph svg{width: 32px; height: 32px}
  .info{padding: 8px 0 6px}
  .track{font-size: 14px}
  .artist{font-size: 12px}
  .vu-wrap{padding-bottom: 8px}
  .ctrls{gap: 8px; padding-bottom: 6px}
  .ctrls button{width: 36px; height: 36px}
  .ctrls .play{width: 48px; height: 48px}
  .ctrls .play svg{width: 20px; height: 20px}
  .vol-wrap{padding-top: 6px; gap: 4px}
  .vol-wrap input[type="range"]{width: 80px}
  .hist-wrap{width: 100%; max-height: 100px; padding: 10px 12px; border-radius: 12px}
  .hist-list{max-height: 50px}
  .hist-item{padding: 3px 0}
  .hist-item .thmb{width: 24px; height: 24px}
  .hist-item .hi-t{font-size: 11px}
  .hist-item .hi-a{font-size: 9px}
}
@media(max-width: 400px){
  .cover-wrap{max-width: 200px; border-radius: 12px}
  .cover-wrap .ph svg{width: 32px; height: 32px}
  .track{font-size: 14px}
  .artist{font-size: 12px}
}
</style>
</head>
<body>

<div class="et-bg" id="etBg"></div>
<div id="app">
  <!-- Top bar -->
  <div class="top">
    <div class="top-left">
      <a href="index.html" class="back-btn" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <span class="brand">Rádio NexusPT</span>
    </div>
    <button class="et-btn" id="etBtn" title="ET Mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
        <circle cx="12" cy="13" r="8"/>
        <circle cx="9" cy="11" r="1.2" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.2" fill="currentColor"/>
        <path d="M8 16c.5.5 2 1.5 4 1.5s3.5-1 4-1.5"/>
        <path d="M4 5l3 2M20 5l-3 2"/>
      </svg>
    </button>
    <span class="rec on" id="recLed"></span>
    <span class="status" id="st">a ligar...</span>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="hist-wrap">
      <div class="hist-hdr">Histórico</div>
      <div class="hist-list" id="histList"></div>
    </div>
    <div class="player-col">
      <!-- Cover -->
      <div class="cover-wrap">
        <div class="ph" id="coverFb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <img id="coverImg" src="" alt="" referrerpolicy="no-referrer" style="opacity:0;">
      </div>

      <!-- Track -->
      <div class="info">
        <div class="track ph" id="ttl">A carregar...</div>
        <div class="artist ph" id="art">A aguardar música</div>
      </div>

      <!-- VU -->
      <div class="vu-wrap">
        <div class="vu-track">
          <div class="vu-fill" id="vuFill"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="ctrls">
        <button disabled id="prevBtn" title="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="play" id="playBtn" title="Play / Pausa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="playI"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="pauseI" style="display:none"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>
        </button>
        <button disabled id="nextBtn" title="Seguinte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="vol-wrap">
        <span class="vol-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </span>
        <input type="range" id="volS" min="0" max="100" value="80">
        <span class="vol-pct" id="volP">80%</span>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const STREAM   = 'https://stream.zeno.fm/fmgajinfd6ctv';
  const META     = 'https://api.zeno.fm/mounts/metadata/subscribe/g4yosibn9yivv';
  const PROXY    = 'http://nexuspt.great-site.net/radio.php?q=';
  const VOL_KEY  = 'nx_vol';
  const PACOTE_IMG = 'et.jpg';
  const PACOTE_KEYWORDS = ['pacotada remix', 'pó pacotar remix', 'po pacotar remix', 'pacotar remix', 'pacotada', ' 1155 do ET Circulation '];

  const a = new Audio();
  a.preload='auto'; a.volume=parseFloat(localStorage.getItem(VOL_KEY))||0.8; a.muted=true;

  const $=s=>document.getElementById(s);
  const playBtn=$('playBtn'),playI=$('playI'),pauseI=$('pauseI');
  const coverImg=$('coverImg'),coverFb=$('coverFb');
  const ttl=$('ttl'),art=$('art'),st=$('st'),recLed=$('recLed');
  const volS=$('volS'),volP=$('volP'),vuFill=$('vuFill');

  let playing=0,curT='',curA='',lastArt='',metaOK=0;
  let vuInt=null,sseStop=0,recT=null;
  const histList=$('histList');
  const history=[];
  const MAX_HIST=30;

  function addHist(a,t,c){
    history.unshift({artist:a,title:t,cover:c||''});
    if(history.length>MAX_HIST)history.pop();
    renderHist();
  }
  function updHistCover(u){
    if(history.length&&!history[0].cover&&u){history[0].cover=u;renderHist();}
  }
  function renderHist(){
    let h='';
    for(const e of history){
      if(e.cover){
        h+='<div class="hist-item"><img class="thmb" src="'+e.cover+'" alt="" loading="lazy"><div class="hi"><div class="hi-t">'+e.title+'</div><div class="hi-a">'+e.artist+'</div></div></div>';
      }else{
        h+='<div class="hist-item"><span class="thmb thmb-fb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span><div class="hi"><div class="hi-t">'+e.title+'</div><div class="hi-a">'+e.artist+'</div></div></div>';
      }
    }
    histList.innerHTML=h;
  }

  function sts(t,type=''){
    st.textContent=t;
    st.className='status'+(type?' '+type:'');
  }

  function vu(on){
    if(on){
      if(vuInt)return;
      vuInt=setInterval(()=>{
        if(!playing){vuFill.style.width='0%';return;}
        vuFill.style.width=(10+Math.random()*80)+'%';
      },250);
    }else{
      if(vuInt){clearInterval(vuInt);vuInt=null;}
      vuFill.style.width='0%';
    }
  }

  function parse(s){
    if(!s||!s.trim())return{a:'—',t:'A carregar...'};
    const p=s.split(' - ');
    return p.length>=2?{a:p[0].trim(),t:p.slice(1).join(' - ').trim()}:{a:'—',t:s.trim()};
  }

  function show(t,a){
    ttl.textContent=t;art.textContent=a;
    ttl.classList.toggle('ph',t==='A carregar...');
    art.classList.toggle('ph',!a||a==='—');
  }

  function setImg(url){
    if(!url){coverImg.style.opacity='0';coverFb.classList.remove('hide');lastArt='';return;}
    if(url===lastArt&&coverImg.style.opacity==='1')return;
    lastArt=url;coverFb.classList.add('hide');coverImg.style.opacity='0';
    coverImg.onload=()=>{coverImg.style.opacity='1';onCoverChange(url)};
    coverImg.onerror=()=>{coverImg.style.opacity='0';coverFb.classList.remove('hide');coverImg.removeAttribute('src')};
    coverImg.src=url;
  }

  function btn(on){
    playing=on;
    playI.style.display=on?'none':'block';
    pauseI.style.display=on?'block':'none';
    recLed.className='rec'+(on?' on':' off');
    vu(on);
  }

  (()=>{volP.textContent=volS.value+'%'})();
  volS.addEventListener('input',()=>{
    a.volume=volS.value/100;
    volP.textContent=volS.value+'%';
    localStorage.setItem(VOL_KEY,volS.value/100);
  });

  let artT=null;
  function fetchCover(artist,title){
    if(!artist||!title||artist==='—'){setImg('');return;}
    if(isPacote(title))return;
    if(artT)clearTimeout(artT);
    artT=setTimeout(()=>{
      const q1=encodeURIComponent(artist+' '+title);
      const q2=encodeURIComponent(title);
      function trySet(d,coverKey,sizeKey){
        if(d.data&&d.data[0]&&d.data[0].album&&d.data[0].album[coverKey]){
          const u=d.data[0].album[coverKey];setImg(u);msess(curT,curA,u);updHistCover(u);return true;
        }
        if(d.results&&d.results[0]&&d.results[0][sizeKey]){
          const u=d.results[0][sizeKey].replace('100x100bb','600x600bb');setImg(u);msess(curT,curA,u);updHistCover(u);return true;
        }
        return false;
      }
      function tryProxy(i,qs){if(i>=qs.length){tryDeezer(0,[q1,q2]);return;}fetch(PROXY+qs[i]).then(r=>r.json()).then(d=>{if(!trySet(d,'cover_xl','artworkUrl100'))tryProxy(i+1,qs);}).catch(()=>tryProxy(i+1,qs));}
      function tryDeezer(i,qs){if(i>=qs.length){tryItunes(0,[q1,q2]);return;}fetch('https://api.deezer.com/search?q='+qs[i]).then(r=>r.json()).then(d=>{if(!trySet(d,'cover_xl','artworkUrl100'))tryDeezer(i+1,qs);}).catch(()=>tryDeezer(i+1,qs));}
      function tryItunes(i,qs){if(i>=qs.length)return;fetch('https://itunes.apple.com/search?term='+qs[i]+'&limit=5&entity=song').then(r=>r.json()).then(d=>{if(!trySet(d,'cover_xl','artworkUrl100'))tryItunes(i+1,qs);}).catch(()=>{});}
      tryProxy(0,[q1,q2]);
    },150);
  }

  function msess(t,a,u){
    if(!('mediaSession'in navigator))return;
    const m={};if(t)m.title=t;if(a)m.artist=a;
    if(u)m.artwork=[{src:u,sizes:'256x256',type:'image/jpeg'},{src:u.replace('cover_xl','cover_big'),sizes:'500x500',type:'image/jpeg'}];
    try{navigator.mediaSession.metadata=new MediaMetadata(m)}catch(_){}
  }
  if('mediaSession'in navigator){
    navigator.mediaSession.setActionHandler('play',()=>{if(!playing)tg()});
    navigator.mediaSession.setActionHandler('pause',()=>{if(playing)tg()});
  }

  function isPacote(t){
    const lower = t.toLowerCase();
    return PACOTE_KEYWORDS.some(k => lower.includes(k));
  }

  function onTrack(raw){
    const{a:artist,t:title}=parse(raw);
    if(title===curT&&artist===curA)return;
    curT=title;curA=artist;metaOK=1;
    show(title,artist);
    if(isPacote(title)){
      lastArt='';
      coverFb.classList.add('hide');
      coverImg.style.opacity='0';
      coverImg.onload=()=>{coverImg.style.opacity='1';onCoverChange(PACOTE_IMG)};
      coverImg.onerror=()=>{coverImg.style.opacity='0';coverFb.classList.remove('hide')};
      coverImg.src=PACOTE_IMG;
      msess(title,artist,PACOTE_IMG);
      addHist(artist,title,PACOTE_IMG);
    }else{
      fetchCover(artist,title);
      msess(title,artist,'');
      addHist(artist,title);
    }
  }

  async function connect(){
    if(recT){clearTimeout(recT);recT=null;}
    sseStop=0;sts('a ligar...');
    while(!sseStop){
      try{
        const r=await fetch(META);
        if(!r.ok)throw Error('HTTP '+r.status);
        const rd=r.body.getReader(),dc=new TextDecoder();
        let buf='';sts('conectado');
        while(!sseStop){
          const{done,value}=await rd.read();
          if(done)break;
          buf+=dc.decode(value,{stream:true});
          const ps=buf.split('\n\n');buf=ps.pop()||'';
          for(const e of ps){if(e.trim())parseSSE(e);}
        }
        rd.releaseLock();
      }catch(e){console.warn('⚠️',e.message);sts(e.message,'err');}
      if(!sseStop)await new Promise(r=>{recT=setTimeout(r,4000)});
    }
  }
  function parseSSE(raw){
    let t='',d='';
    for(const l of raw.split('\n')){
      if(l.startsWith('event:'))t=l.slice(6).trim();
      else if(l.startsWith('data:'))d=l.slice(5).trim();
    }
    if(t==='message'&&d){
      try{
        const p=JSON.parse(d);
        if(p.streamTitle){onTrack(p.streamTitle);if(playing)sts('a tocar','ok');else sts('em pausa');}
      }catch(_){}
    }
  }

  a.src=STREAM;
  a.addEventListener('canplay',()=>{
    a.play().then(()=>{a.muted=0;btn(1);sts('a tocar','ok')}).catch(e=>{
      setTimeout(()=>{a.play().then(()=>{a.muted=0;btn(1);sts('a tocar','ok')}).catch(()=>{})},500);
    });
  });
  a.addEventListener('play',()=>{a.muted=0;btn(1);sts(metaOK?'a tocar':'a tocar...','ok')});
  a.addEventListener('pause',()=>{btn(0);sts('em pausa')});
  a.addEventListener('waiting',()=>sts('a bufferizar...','buf'));
  a.addEventListener('error',()=>{sts('erro no stream','err');btn(0)});

  // ─── ET MODE ───
  let etOn=0;
  const etBtn=$('etBtn'),etBg=$('etBg');
  function etBgImg(u){
    etBg.style.backgroundImage='url('+u+')';
  }
  etBtn.addEventListener('click',()=>{
    etOn=!etOn;
    etBtn.classList.toggle('on',etOn);
    document.body.classList.toggle('et-mode',etOn);
    etBg.classList.toggle('on',etOn);
    if(etOn){
      etBgImg(PACOTE_IMG);
      coverFb.classList.add('hide');
      coverImg.style.opacity='0';
      coverImg.onload=()=>{coverImg.style.opacity='1'};
      coverImg.src=PACOTE_IMG;
      msess(curT,curA,PACOTE_IMG);
    }else{
      etBg.style.backgroundImage='none';
      if(curT&&curT!=='A carregar...')fetchCover(curA,curT);
    }
  });
  function onCoverChange(url){
    if(!url||url.includes('et.jpg'))return;
  }

  function tg(){if(playing){a.pause()}else{a.play().then(()=>sts('a tocar','ok')).catch(()=>{})}}
  playBtn.addEventListener('click',tg);
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();tg()}});

  connect();
  setInterval(()=>{if(curT&&curT!=='A carregar...'&&playing&&!isPacote(curT))fetchCover(curA,curT)},120000);
})();
</script>
</body>
</html>
