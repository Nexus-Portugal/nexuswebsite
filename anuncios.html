<!doctype html>
<html lang="pt-pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anúncios | NexusPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-primary: #0a0a0a;
  --bg-secondary: #141414;
  --bg-tertiary: #1a1a1a;
  --text-primary: #ffffff;
  --text-secondary: #b0b0b0;
  --accent-gradient: linear-gradient(135deg, #00f43c 0%, #00c9ff 100%);
  --border-subtle: rgba(255,255,255,0.08);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --container: 1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
}
.wrap{max-width: var(--container); margin: auto; padding: 0 24px}

.header{
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  padding: 20px 0;
  transition: all 0.4s var(--ease-smooth);
}
.header.scrolled{
  padding: 12px 0;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}
.header .wrap{display: flex; justify-content: space-between; align-items: center}
.logo img{height: 42px}
.nav{display: flex; gap: 8px}
.nav a{
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
  padding: 10px 16px;
  border-radius: 8px;
  transition: all 0.3s var(--ease-smooth);
}
.nav a:hover,.nav a.active{color: var(--text-primary); background: rgba(255,255,255,0.08)}

.menu-toggle{
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  cursor: pointer;
}
.menu-toggle span{
  display: block;
  width: 20px;
  height: 2px;
  background: var(--text-primary);
  position: relative;
}
.menu-toggle span::before,
.menu-toggle span::after{
  content: '';
  position: absolute;
  width: 20px;
  height: 2px;
  background: var(--text-primary);
  left: 0;
}
.menu-toggle span::before{top: -6px}
.menu-toggle span::after{top: 6px}
.menu-toggle.active span{background: transparent}
.menu-toggle.active span::before{transform: rotate(45deg); top: 0}
.menu-toggle.active span::after{transform: rotate(-45deg); top: 0}

.mobile-nav{
  display: none;
  position: fixed;
  top: 0;
  right: -100%;
  width: 80%;
  max-width: 320px;
  height: 100vh;
  background: var(--bg-secondary);
  padding: 100px 32px 32px;
  transition: right 0.4s var(--ease-smooth);
  z-index: 999;
  border-left: 1px solid var(--border-subtle);
}
.mobile-nav.active{right: 0}
.mobile-nav a{
  display: block;
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
  font-size: 18px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.mobile-nav a.active{color: var(--text-primary)}
.mobile-overlay{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.3s var(--ease-smooth);
  z-index: 998;
  pointer-events: none;
}
.mobile-overlay.active{
  display: block;
  opacity: 1;
  pointer-events: auto;
}

/* ===== PAGE HEADER ===== */
.page-header{
  padding-top: 140px;
  padding-bottom: 60px;
  text-align: center;
  background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  border-bottom: 1px solid var(--border-subtle);
}
.page-header h1{
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}
.page-header p{
  color: var(--text-secondary);
  font-size: 18px;
  max-width: 600px;
  margin: 0 auto;
}

/* ===== CONTENT ===== */
.ad-section{padding: 80px 0; max-width: 900px; margin: 0 auto}
.ad-section h2{
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 600;
  margin-bottom: 24px;
  color: var(--text-primary);
}
.ad-section p{
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 12px;
}
.ad-section a.test-link{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  background: var(--accent-gradient);
  color: #0a0a0a;
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  border-radius: 10px;
  margin-top: 24px;
  transition: transform 0.3s var(--ease-smooth);
}
.ad-section a.test-link:hover{transform: translateY(-2px)}

.footer{
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-subtle);
  padding: 60px 0 30px;
  text-align: center;
}
.footer-links{display: flex; justify-content: center; gap: 32px; margin-bottom: 30px; flex-wrap: wrap}
.footer-links a{
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
}
.footer-links a:hover{color: var(--text-primary)}
.footer p{color: var(--text-secondary); font-size: 14px}

/* ===== CLIENT AREA ICON ===== */
.client-area {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 1rem;
  text-decoration: none;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.client-area img {
  width: 32px;
  height: 32px;
  display: block;
}
.client-area:hover {
  transform: scale(1.1);
  opacity: 0.85;
}

.fade-in{
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s var(--ease-smooth);
}
.fade-in.show{opacity: 1; transform: translateY(0)}

/* ===== SCROLL PROGRESS ===== */
.scroll-progress{
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  background: var(--accent-gradient);
  z-index: 1001;
  transition: width 0.1s linear;
}

@media(max-width: 768px){
  .menu-toggle{display: flex}
  .mobile-nav{display: block}
  .mobile-overlay.active{display: block}
  .nav{display: none}
  .page-header{padding-top: 100px; padding-bottom: 40px}
  .ad-section{padding: 60px 24px}
  .client-area { display: none; }
}
</style>
</head>

<body>

<section class="page-header">
  <div class="wrap">
    <h1>Anúncios</h1>
    <p>Conteúdo patrocinado e ofertas em destaque</p>
  </div>
</section>

<section class="ad-section">
  <div class="wrap">

    <div class="fade-in">
      <h2>Ofertas em Destaque</h2>
      <p>Descobre ofertas exclusivas e promoções selecionadas para ti.</p>
      <a href="https://omg10.com/4/11035372" class="test-link" target="_blank" rel="noopener noreferrer">teste →</a>
    </div>

  </div>
</section>

<script>
const fadeElements = document.querySelectorAll('.fade-in');
const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
      fadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });
fadeElements.forEach(el => fadeObserver.observe(el));

// Override footer links — no extra link (ads page)
(function() {
  const footerLinks = document.querySelectorAll('.footer-links a');
  if (footerLinks.length >= 4) {
    footerLinks[0].href = 'cookies.html';
    footerLinks[1].href = 'privacidade.html';
    footerLinks[2].href = 'termos.html';
    footerLinks[3].href = '#';
  }
})();
</script>
