<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPT - Manutenção</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #070708;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        img {
            height: 100vh;
            width: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <img src="https://kikalabs-server.nexuspt.eu/images/site-nxweb/nginx/manutencaonexus.png" alt="Página de manutenção">

</body>
</html>
