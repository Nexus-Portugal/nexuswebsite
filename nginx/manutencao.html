<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #070708;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        img {
            height: 100vh;
            width: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>
    <img
        src="https://kikalabs-server.nexuspt.eu/images/site-nxweb/nginx/manutencaonexus.png"
        alt="Página de manutenção"
    >

    <script>
        const redirectUrl = "https://ia.nexuspt.eu";
        const interval = 5000;

        async function checkSite() {
            // Só permite o redirecionamento quando esta página
            // está num domínio nexuspt.eu ou num subdomínio dele.
            const hostname = window.location.hostname;

            if (
                hostname !== "nexuspt.eu" &&
                !hostname.endsWith(".nexuspt.eu")
            ) {
                return;
            }

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 4000);

                const response = await fetch(
                    redirectUrl + "/?maintenance_check=" + Date.now(),
                    {
                        method: "HEAD",
                        cache: "no-store",
                        signal: controller.signal
                    }
                );

                clearTimeout(timeout);

                if (response.ok) {
                    window.location.replace(redirectUrl);
                }
            } catch (error) {

            }
        }

        checkSite();
        setInterval(checkSite, interval);
    </script>
</body>
</html>
