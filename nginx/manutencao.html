<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #070708;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        img {
            height: 100vh;
            width: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        #checker {
            display: none;
        }
    </style>
</head>

<body>

    <img
        src="https://kikalabs-server.nexuspt.eu/images/site-nxweb/nginx/manutencaonexus.png"
        alt="Página de manutenção"
    >

    <iframe id="checker"></iframe>

    <script>
        const SERVICE = "https://ia.nexuspt.eu/";
        const CHECK_INTERVAL = 5000;

        // Só permite esta lógica em nexuspt.eu
        const hostname = window.location.hostname;

        if (
            hostname === "nexuspt.eu" ||
            hostname.endsWith(".nexuspt.eu")
        ) {
            const checker = document.getElementById("checker");

            let checking = false;

            function checkService() {
                if (checking) return;

                checking = true;

                let redirected = false;

                const redirect = () => {
                    if (redirected) return;

                    redirected = true;
                    window.location.replace(SERVICE);
                };

                checker.onload = redirect;

                checker.onerror = () => {
                    checking = false;
                };

                checker.src = SERVICE + "?maintenance_check=" + Date.now();

                setTimeout(() => {
                    if (!redirected) {
                        checking = false;
                    }
                }, 4000);
            }

            checkService();

            setInterval(checkService, CHECK_INTERVAL);
        }
    </script>

</body>
</html>
